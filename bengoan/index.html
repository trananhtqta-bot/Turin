<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6dc8c">
<meta name="description" content="Bé Ngoan Giúp Mẹ – trò chơi việc tốt cho bé, từ mẫu giáo đến cấp 2.">
</head>
<body>
<title>Bé Ngoan Giúp Mẹ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Sân gạch nhà bà: tường vôi vàng, gạch đỏ, hoa đỏ bé ngoan. Một thế giới ấm duy nhất, không đổi theo giao diện tối. */
:root{
  --voi:#f6dc8c;        /* tường vôi vàng */
  --voi2:#fbecc0;
  --gach:#b9573a;       /* gạch sân */
  --gach2:#a54a30;
  --la:#3d8b4f;         /* lá xanh */
  --hoa:#e0322a;        /* hoa đỏ bé ngoan */
  --muc:#3b2417;        /* chữ mực nâu */
  --giay:#fff8ea;       /* giấy phiếu */
  --troi:#bfe6f2;
  --font-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
.card p.big{font-size:30px;margin:8px 0 4px}
html,body{height:100%;margin:0;overflow:hidden;background:var(--voi);color:var(--muc);font-family:var(--font-body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar h1{flex:1;min-width:0;margin:0;font-family:var(--font-display);font-size:24px;line-height:1.1;text-wrap:balance}
.flowers{display:flex;align-items:center;gap:4px;background:var(--giay);border:2px solid var(--muc);border-radius:999px;padding:2px 12px 2px 8px;font-family:var(--font-display);font-size:20px;font-variant-numeric:tabular-nums}
.btn{font-family:var(--font-display);font-weight:800;font-size:20px;border:3px solid var(--muc);border-radius:18px;background:var(--giay);color:var(--muc);padding:8px 16px;cursor:pointer;box-shadow:0 4px 0 var(--muc)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--muc)}
.btn:focus-visible{outline:4px solid var(--hoa);outline-offset:2px}
.btn.red{background:var(--hoa);color:#fff}
.btn.icon{width:52px;height:52px;padding:0;font-size:26px;line-height:1;display:grid;place-items:center;flex:none}
.screen{flex:1;min-height:0;position:relative;overflow:auto}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px 20px}
/* nhà bà */
.house{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:520px;margin:0 auto}
.room{position:relative;border:3px solid var(--muc);border-radius:22px;background:var(--giay);padding:10px 10px 12px;text-align:center;cursor:pointer;box-shadow:0 5px 0 var(--muc);font:inherit;color:inherit}
.room:active{transform:translateY(3px);box-shadow:0 2px 0 var(--muc)}
.room:focus-visible{outline:4px solid var(--hoa);outline-offset:3px}
.room canvas{width:100%;aspect-ratio:1/0.8;display:block;border-radius:14px}
.room b{display:block;font-family:var(--font-display);font-size:21px;margin-top:6px;line-height:1.1}
.room .got{position:absolute;top:-10px;right:-8px;width:40px;height:40px}
.wide{grid-column:1/-1;display:flex;gap:12px;align-items:center;text-align:left}
.wide canvas{width:96px;flex:none;aspect-ratio:1/1}
.wide b{margin:0}
.wide span{display:block;font-size:15px;font-weight:700;opacity:.8}
.hello{max-width:520px;margin:0 auto 12px;font-size:18px;font-weight:700;line-height:1.35}
/* trò chơi */
#game{position:absolute;inset:0;touch-action:none;display:block;width:100%;height:100%}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 32px));background:rgba(255,248,234,.95);border:3px solid var(--muc);border-radius:18px;padding:8px 12px;font-weight:800;font-size:17px;text-align:center;line-height:1.3;pointer-events:none}
/* phiếu */
.phieu{max-width:520px;margin:0 auto;background:var(--giay);border:3px solid var(--muc);border-radius:20px;padding:16px;background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(224,50,42,.12) 31px 32px)}
.phieu h2{font-family:var(--font-display);font-size:30px;color:var(--hoa);margin:0;text-align:center;letter-spacing:.5px}
.phieu .who{text-align:center;font-weight:800;font-size:18px;margin:2px 0 12px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:#fff;border:2px solid var(--muc);border-radius:12px;padding:4px 2px 6px;text-align:center;min-height:86px}
.day.today{background:#ffe9b3}
.day i{display:block;font-style:normal;font-size:12px;font-weight:800;letter-spacing:.5px}
.day .fl{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;margin-top:4px}
.day .fl svg{width:16px;height:16px}
.total{margin-top:12px;font-weight:800;font-size:17px;text-align:center}
.prog{height:16px;border:2px solid var(--muc);border-radius:999px;background:#fff;overflow:hidden;margin-top:6px}
.prog div{height:100%;background:var(--hoa)}
/* góc của mẹ */
.card{max-width:520px;margin:0 auto 14px;background:var(--giay);border:3px solid var(--muc);border-radius:20px;padding:14px}
.card h2{font-family:var(--font-display);font-size:24px;margin:0 0 4px}
.card p{margin:0 0 10px;font-size:16px;line-height:1.4;font-weight:700}
.task{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:2px dashed rgba(59,36,23,.25)}
.task:first-of-type{border-top:0}
.task span{flex:1;min-width:0;font-weight:800;font-size:17px}
.task .btn{font-size:16px;padding:6px 12px}
.task .done{font-size:16px;font-weight:800;color:var(--la)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{flex:1;min-width:0;font:inherit;font-size:17px;font-weight:700;border:3px solid var(--muc);border-radius:14px;padding:8px 12px;background:#fff;color:var(--muc)}
.chip{font-size:15px;padding:5px 12px;box-shadow:0 3px 0 var(--muc)}
.chip.on{background:var(--muc);color:var(--giay)}
.task small.tag{display:block;font-size:13px;font-weight:700;opacity:.7;margin-top:2px}
.sec{max-width:520px;margin:16px auto 8px;font-family:var(--font-display);font-size:22px}
.todo{max-width:520px;margin:0 auto;display:grid;gap:10px}
.todo-item{display:flex;align-items:center;gap:12px;text-align:left;font:inherit;color:inherit;background:var(--giay);border:3px solid var(--muc);border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 var(--muc);cursor:pointer}
.todo-item:active{transform:translateY(3px);box-shadow:0 1px 0 var(--muc)}
.todo-item:focus-visible{outline:4px solid var(--hoa);outline-offset:2px}
.todo-item .mark{flex:none;width:40px;height:40px;border:3px solid var(--muc);border-radius:12px;background:#fff;display:grid;place-items:center;font-size:22px}
.todo-item .mark svg{width:34px;height:34px}
.todo-item .tx{flex:1;min-width:0;font-weight:800;font-size:18px;line-height:1.2}
.todo-item small{display:block;font-size:14px;font-weight:700;opacity:.7;margin-top:2px}
.todo-item.done{background:#e9f6e4}
.todo-item.pend{background:#fff1c9}
.tiles{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;color:inherit;background:var(--giay);border:3px solid var(--muc);border-radius:18px;padding:10px 6px 10px;box-shadow:0 4px 0 var(--muc);cursor:pointer;min-width:0}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--muc)}
.tile:focus-visible{outline:4px solid var(--hoa);outline-offset:2px}
.tile .ic{font-size:38px;line-height:1.1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.tile b{font-family:var(--font-display);font-size:15px;line-height:1.1;text-align:center;text-wrap:balance}
.tile .got{position:absolute;top:-10px;right:-8px;width:34px;height:34px}
.diff{max-width:520px;margin:10px auto 4px;display:flex;gap:8px}.dbtn{flex:1;font:inherit;font-family:var(--font-display);font-size:17px;color:inherit;background:var(--giay);border:3px solid var(--muc);border-radius:16px;padding:8px 4px;box-shadow:0 3px 0 var(--muc);cursor:pointer}.dbtn.on{background:#e0322a;color:#fff}
.tile.soon{opacity:.55;cursor:default;box-shadow:none;border-style:dashed}
.sec .cnt{font-family:var(--font-body);font-size:14px;font-weight:800;opacity:.7;margin-left:6px}
.stars{font-size:44px;line-height:1;margin:6px 0 0;color:#f0a52a;letter-spacing:4px}
.stars span{color:rgba(59,36,23,.18)}
.tile i.st{font-style:normal;font-size:12px;color:#f0a52a;letter-spacing:1px;line-height:1}
.gate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gate .btn{font-size:24px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:420px;margin:0 auto}
.pick button canvas{width:100%;aspect-ratio:1;display:block}
.center{text-align:center}
.big{font-family:var(--font-display);font-size:34px;line-height:1.05;margin:8px 0 4px;text-wrap:balance}
/* lớp chúc mừng */
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(59,36,23,.45);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.overlay .card{text-align:center;width:100%}
.overlay svg.bigflower{width:110px;height:110px;display:block;margin:0 auto;animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.2) rotate(-40deg)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.overlay svg.bigflower{animation:none}}
.small{font-size:14px;font-weight:700;opacity:.8}
.kids{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.kids.sm{grid-template-columns:repeat(4,1fr);gap:8px}
.kidc{font:inherit;color:inherit;background:var(--giay);border:3px solid var(--muc);border-radius:20px;padding:10px 6px;box-shadow:0 4px 0 var(--muc);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.kidc canvas{width:100%;max-width:130px;aspect-ratio:1;display:block}
.kidc b{font-family:var(--font-display);font-size:22px;line-height:1.1}.kids.sm b{font-size:16px}
.kidc span{display:flex;align-items:center;gap:3px;font-weight:800;font-size:15px}.kidc span svg{width:18px;height:18px}
.kidc.on{background:#ffe9b3;border-color:var(--hoa);box-shadow:0 4px 0 var(--hoa)}
.kidc.add{border-style:dashed}.kidc .plus{font-family:var(--font-display);font-size:64px;line-height:1.3;width:100%;max-width:130px;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;background:#fff}
.looks{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.look{font:inherit;color:inherit;background:#fff;border:3px solid var(--muc);border-radius:16px;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:14px}
.look canvas{width:72px;height:72px}.look.on{background:#ffe9b3;border-color:var(--hoa)}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid var(--muc);cursor:pointer;padding:0}.sw.on{outline:4px solid var(--hoa);outline-offset:2px}
.hi{max-width:520px;margin:0 auto 8px;display:flex;align-items:center;gap:10px}.hi canvas{width:58px;height:58px;flex:none}.hi p{flex:1;margin:0;font-weight:700;font-size:17px;line-height:1.3}
.teaser{display:block;width:100%;max-width:520px;margin:6px auto;font:inherit;font-weight:800;font-size:16px;text-align:left;color:var(--muc);background:#fff1c9;border:3px dashed var(--hoa);border-radius:16px;padding:10px 12px;cursor:pointer}
.rews{max-width:520px;margin:0 auto 14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rew{font:inherit;color:inherit;background:var(--giay);border:3px solid var(--muc);border-radius:20px;padding:12px 10px;box-shadow:0 4px 0 var(--muc);cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:center}
.rew .re{font-size:52px;line-height:1.1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}.rew b{font-family:var(--font-display);font-size:20px}.rew small{font-weight:700;font-size:13px;line-height:1.25}
.rew.lock{background:#f1e6cf}.rew .prog{height:12px;margin:2px 0}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:58%;overflow:auto;background:var(--giay);border-top:3px solid var(--muc);border-radius:22px 22px 0 0;padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px));z-index:4}
.shh{display:flex;align-items:center;gap:10px;margin-bottom:8px}.shh b{flex:1;font-family:var(--font-display);font-size:20px}.shh span{font-weight:800}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.shi{font:inherit;color:inherit;background:#fff;border:3px solid var(--muc);border-radius:14px;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.shi span{font-size:34px;line-height:1.2;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}.shi small{font-weight:800;font-size:12px;line-height:1.15;text-align:center}.shi i{font-style:normal;font-weight:800;font-size:13px;display:flex;align-items:center;gap:2px}.shi i svg{width:14px;height:14px}
.shi.poor{opacity:.5}.shi.on{background:#ffe9b3;border-color:var(--hoa)}
.petbar{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 12px}.petbar .btn{font-size:17px;padding:8px 12px}
.wardui{position:absolute;left:0;right:0;bottom:0;height:48%;overflow:auto;background:var(--giay);border-top:3px solid var(--muc);border-radius:22px 22px 0 0;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.wardui .tabs{margin-bottom:8px}.wardui .cols{margin-top:10px;justify-content:center}.wardui .sw{width:34px;height:34px}
.cam{display:inline-block;font-size:24px;padding:12px 22px}
.phgrid{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ph{background:#fff;border:3px solid var(--muc);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}.ph img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#eee}.ph span{font-weight:800;font-size:14px;padding:4px 8px 0}.ph small{font-size:12px;font-weight:700;opacity:.7;padding:0 8px 6px}
.ph.ok{border-color:var(--la)}.ph.no{opacity:.55}
.apv{display:flex;gap:10px;padding:10px 0;border-top:2px dashed rgba(59,36,23,.25)}.apv img{width:110px;height:146px;object-fit:cover;border-radius:10px;border:2px solid var(--muc);flex:none;background:#eee}.apv>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.apv small{font-weight:700}.apv .warn{color:#b0281f}
.apv .btn{font-size:15px;padding:5px 10px}.btn[disabled]{opacity:.45;cursor:not-allowed}
.badge{display:inline-block;background:var(--hoa);color:#fff;border-radius:999px;font-size:16px;padding:0 9px;vertical-align:middle}
.rank{display:grid;gap:6px;margin:10px 0}.rk{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--muc);border-radius:14px;padding:6px 10px;text-align:left}.rk .md{font-size:28px}.rk canvas{width:44px;height:44px;flex:none}.rk b{font-family:var(--font-display);font-size:19px}.rk small{margin-left:auto;font-weight:800;font-size:13px}
.kidrow canvas{width:44px;height:44px;flex:none}.kidrow span{cursor:pointer}.kidrow.cur{background:#fff1c9;border-radius:12px}
.dstart{position:sticky;bottom:0;padding:12px 0;text-align:center;background:linear-gradient(transparent,var(--voi) 30%)}.dstart .btn{font-size:24px}
.tile.sel{background:#ffe9b3;border-color:var(--hoa);box-shadow:0 4px 0 var(--hoa)}
.day .more,.day .dn{display:block;font-family:var(--font-display);font-size:13px;line-height:1}.day .dn{margin-top:2px;color:var(--hoa)}
.note{font-size:14px;font-weight:700;opacity:.75;text-align:center;max-width:520px;margin:10px auto 0;line-height:1.4}
</style>

<div id="app">
  <div class="bar">
    <button class="btn icon" id="bBack" aria-label="Về nhà" hidden>⌂</button>
    <h1 id="title">Bé Ngoan Giúp Mẹ</h1>
    <button class="btn icon" id="bSay" aria-label="Nghe lại">🔊</button>
    <div class="flowers" id="fl" aria-label="Số hoa bé ngoan"></div>
  </div>
  <div class="screen" id="screen"></div>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const screen=$('#screen');
const R=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const FLOWER='<svg viewBox="0 0 40 40" aria-hidden="true"><g fill="#e0322a">'+[0,72,144,216,288].map(a=>`<ellipse cx="20" cy="10" rx="7" ry="9" transform="rotate(${a} 20 20)"/>`).join('')+'</g><circle cx="20" cy="20" r="6" fill="#f6c443"/></svg>';

/* ---------- lưu trên máy ---------- */
const KEY='bengoan_v1';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();};
let ALL={kids:[],cur:0,goal:15};
let S={kid:null,days:{},tasks:[],best:{}};
try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o){if(o.kids)ALL=Object.assign(ALL,o);else if(o.kid)ALL.kids=[Object.assign({id:'k1'},S,o)];}}catch(e){}
if(ALL.kids.length)S=ALL.kids[Math.min(ALL.cur||0,ALL.kids.length-1)];
function fixS(){['best','house','seen'].forEach(k=>{if(!S[k])S[k]={};});if(!S.days)S.days={};if(!S.tasks)S.tasks=[];if(!S.photos)S.photos=[];if(S.spent==null)S.spent=0;if(!S.av)S.av={hair:0,shirt:S.kid==='ti'?'#3f86c9':'#ef7fa0'};if(!S.id)S.id='k'+Date.now().toString(36);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ALL));}catch(e){}}
function todayRec(){const k=today();if(!S.days[k])S.days[k]={games:{},tasks:{},pend:{}};if(!S.days[k].pend)S.days[k].pend={};return S.days[k];}
// việc giao trùng với trò chơi có sẵn thì mở trò chơi đó
const TASK_GAME={'Xếp dép lên kệ':'dep','Nhặt rau giúp mẹ':'rau','Rót nước mời ông bà':'nuoc','Quét sân, quét nhà':'quet'};
function totalFlowers(){let n=0;for(const k in S.days){const d=S.days[k];n+=Object.keys(d.games).length+Object.keys(d.tasks).length;}return n;}
function giveFlower(kind,id){const t=todayRec();if(t[kind][id])return false;t[kind][id]=1;save();drawFl();return true;}
function drawFl(){$('#fl').innerHTML=FLOWER.replace('<svg','<svg width="26" height="26"')+'<span>'+totalFlowers()+'</span>';}
const kidName=()=>(S.name&&S.name.trim())||(S.kid==='na'?'Na':'Tí');

/* ---------- giọng đọc + âm thanh ---------- */
let lastSay='';
const SS=window.speechSynthesis||null;let VO=null;
function pickVoice(){try{const vs=SS?SS.getVoices():[];VO=vs.find(v=>(v.lang||'').toLowerCase().replace('_','-').startsWith('vi'))||null;}catch(e){}}
if(SS){pickVoice();try{SS.onvoiceschanged=pickVoice;}catch(e){}}
function say(t){lastSay=t;if(!SS||!VO)return;try{SS.cancel();const u=new SpeechSynthesisUtterance(t);u.voice=VO;u.lang=VO.lang;u.rate=.9;u.pitch=1.2;SS.speak(u);}catch(e){}}
$('#bSay').onclick=()=>{audio();say(lastSay);};
let AC=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,d,type='sine',v=.06,slide=0){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(50,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);}

function rrect(x,X,Y,W,H,r){x.beginPath();x.roundRect?x.roundRect(X,Y,W,H,r):x.rect(X,Y,W,H);}

  else if(k==='street'||k==='xom'){x.fillStyle=sky('#9fd6ee','#e6f4fa');x.fillRect(0,0,w,h);x.fillStyle='#7cbf6a';x.fillRect(0,h*.5,w,h*.5);x.fillStyle='#e9d4ad';x.fillRect(0,h*.62,w,h*.12);for(let i=0;i<3;i++){const hx=w*(.12+i*.36);x.fillStyle=['#f6dc8c','#f2c4a0','#d9e8b0'][i];x.fillRect(hx-34,h*.3,68,h*.2);x.fillStyle='#a3271c';x.beginPath();x.moveTo(hx-42,h*.3);x.lineTo(hx,h*.2);x.lineTo(hx+42,h*.3);x.fill();}}

  else if(k==='temple'){x.fillStyle='#f4e3bd';x.fillRect(0,0,w,h);x.fillStyle='#8a2c1c';x.beginPath();x.moveTo(w*.05,h*.2);x.quadraticCurveTo(w*.2,h*.08,w*.5,h*.06);x.quadraticCurveTo(w*.8,h*.08,w*.95,h*.2);x.lineTo(w*.95,h*.24);x.lineTo(w*.05,h*.24);x.fill();x.fillStyle='#b8862e';x.fillRect(w*.1,h*.24,w*.8,6);x.fillStyle='#d9b77a';x.fillRect(0,h*.65,w,h*.35);}
  else if(k==='bath'){x.fillStyle='#d8eef2';x.fillRect(0,0,w,h);x.strokeStyle='rgba(80,140,160,.25)';x.lineWidth=2;for(let i=0;i<w;i+=36)for(let j=0;j<h;j+=36)x.strokeRect(i,j,36,36);}

  else {x.fillStyle='#f6dc8c';x.fillRect(0,0,w,h);x.fillStyle='#d9b77a';x.fillRect(0,h*.6,w,h*.4);x.strokeStyle='rgba(120,80,40,.18)';x.lineWidth=2;for(let i=0;i<w;i+=44){x.beginPath();x.moveTo(i,h*.6);x.lineTo(i,h);x.stroke();}}
}
function counter(G,x,txt){const w=G.w;x.font='800 18px "Baloo 2",sans-serif';const tw=x.measureText(txt).width+24;x.fillStyle='rgba(255,248,234,.94)';rrect(x,w-tw-12,10,tw,34,12);x.fill();x.strokeStyle='#3b2417';x.lineWidth=2;x.stroke();x.fillStyle='#3b2417';x.textAlign='center';x.fillText(txt,w-12-tw/2,33);}
function sparkle(fx,x0,y0){for(let i=0;i<10;i++)fx.push({x:x0,y:y0,vx:R(-120,120),vy:R(-160,-20),t:0});}
function drawFx(x,fx,dt){fx.forEach(p=>{p.t+=dt;p.vy+=260*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;});for(let i=fx.length-1;i>=0;i--)if(fx[i].t>.8)fx.splice(i,1);fx.forEach(p=>{x.globalAlpha=1-p.t/.8;x.fillStyle='#f6c443';x.beginPath();x.arc(p.x,p.y,4,0,7);x.fill();});x.globalAlpha=1;}

/* ---------- KÉO VÀO ĐÚNG CHỖ ---------- */
drag(G,C){
  let items=[],tg=[],drag=null,left=0,fx=[],last=performance.now();
  function init(){const {w,h}=G,R0=Math.min(w,h)*.12;
    tg=C.targets.map(t=>({...t,X:t.x*w,Y:t.y*h,r:R0*(t.big||1),got:[]}));
    const n=C.items.length,cols=Math.min(n<=5?5:4,n),rows=Math.ceil(n/cols),bot=h-150,top=Math.min(h*(C.itemTop||(n>8?.5:.58)),bot-rows*74);
    const order=C.items.map((it,i)=>i).sort(()=>Math.random()-.5);
    items=order.map((k,j)=>{const it=C.items[k],c=j%cols,r=Math.floor(j/cols);return{...it,x:w*(c+.5)/cols+R(-8,8),y:top+(bot-top)*((r+.5)/rows)+R(-6,6),sx:0,sy:0,placed:false,s:it.s||1};});
    items.forEach(i=>{i.sx=i.x;i.sy=i.y;});left=items.length;}
  init();
  const accepts=(t,it)=>{if(t.id!==it.t)return false;if(t.cap&&t.got.length>=t.cap)return false;if(C.uniqueKinds&&t.got.some(g=>g.kind===it.kind))return false;return true;};
  return{get _items(){return items},get _tg(){return tg},resize:init,
    down(p){for(let i=items.length-1;i>=0;i--){const it=items[i];if(it.placed)continue;if(Math.hypot(it.x-p.x,it.y-p.y)<38*it.s+6){drag={it,ox:p.x-it.x,oy:p.y-it.y};items.splice(i,1);items.push(it);tone(600,.05,'triangle',.03);if(it.say)say(it.say);return;}}},
    move(p){if(drag){drag.it.x=p.x-drag.ox;drag.it.y=p.y-drag.oy;}},
    up(){if(!drag)return;const it=drag.it;drag=null;let best=null;
      for(const t of tg){const d=Math.hypot(t.X-it.x,t.Y-it.y);if(d<t.r*1.25&&(!best||d<best.d))best={t,d};}
      if(best&&accepts(best.t,it)){const t=best.t;t.got.push(it);it.placed=true;const k=t.got.length-1,sp=t.cap>1?Math.min(30,t.r*.5):0;it.x=t.X+(t.cap>1?(k-(t.cap-1)/2)*sp:0);it.y=t.Y+(C.stackUp?-k*6:6);left--;ding();sparkle(fx,t.X,t.Y);
        if(left===0){G.hint(C.doneHint||'Xong rồi!');G.win();}else if(C.okSay&&Math.random()<.5)say(pick(C.okSay));}
      else{oops();it.x=it.sx;it.y=it.sy;if(best){const m=(best.t.cap&&best.t.got.length>=best.t.cap)?(C.fullSay||'Chỗ này đủ rồi, con để chỗ khác nhé.'):(C.wrongSay||'Chưa đúng chỗ rồi, con thử chỗ khác nhé.');G.hint(m);say(m);}}},
    draw(){const {x,w,h}=G,now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;scene(x,w,h,C.bg);
      for(const t of tg){x.fillStyle='rgba(255,248,234,.75)';x.strokeStyle='#3b2417';x.lineWidth=3;x.setLineDash([7,6]);x.beginPath();x.arc(t.X,t.Y,t.r,0,7);x.fill();x.stroke();x.setLineDash([]);if(t.e)emo(x,t.e,t.X,t.Y-(t.got.length?t.r*.55:0),t.r*(t.got.length?.7:1.05));if(t.label)lbl(x,t.label,t.X,t.Y+t.r+18,14);}
      for(const it of items){const s=it.s*(drag&&drag.it===it?1.15:1);emo(x,it.e,it.x,it.y,46*s);if(it.dirty&&!it.placed){x.fillStyle='rgba(120,80,30,.65)';x.beginPath();x.arc(it.x+8,it.y+6,6,0,7);x.arc(it.x-10,it.y-4,4,0,7);x.fill();}if(it.label&&!it.placed)lbl(x,it.label,it.x,it.y+34*s,13);}
      drawFx(x,fx,dt);counter(G,x,'Còn '+left);}};
},
/* ---------- PHÂN LOẠI: kéo thẻ vào rổ trái/phải ---------- */
sort(G,C){
  const cards=C.cards.slice().sort(()=>Math.random()-.5);let i=0,card=null,drag=null,fx=[],last=performance.now(),said=false;
  function next(){if(i>=cards.length){G.hint(C.doneHint||'Giỏi quá!');G.win();card=null;return;}const {w,h}=G;card={...cards[i],x:w/2,y:h*.36,hx:w/2,hy:h*.36};said=false;}
  next();
  const bins=()=>{const {w,h}=G,bw=Math.min(160,w*.42);return C.bins.map((b,k)=>({...b,X:k?w-bw/2-14:bw/2+14,Y:h-185,W:bw,H:120}));};
  return{get _card(){return card},_bins:()=>bins(),resize(){if(card){card.x=card.hx=G.w/2;card.y=card.hy=G.h*.36;}},
    down(p){if(card&&Math.hypot(p.x-card.x,p.y-card.y)<90){drag={ox:p.x-card.x,oy:p.y-card.y};say(card.label);}},
    move(p){if(drag&&card){card.x=p.x-drag.ox;card.y=p.y-drag.oy;}},
    up(){if(!drag||!card)return;drag=null;const B=bins();const hit=B.find(b=>Math.abs(card.x-b.X)<b.W/2+20&&card.y>b.Y-b.H/2-40);
      if(!hit){card.x=card.hx;card.y=card.hy;return;}
      if(hit.id===card.b){ding();sparkle(fx,hit.X,hit.Y);const m=card.ok||(hit.label+'! Đúng rồi.');say(m);G.hint(m);i++;next();}
      else{oops();const m=card.why||'Chưa đúng rồi, con nghĩ lại nhé.';say(m);G.hint(m);card.x=card.hx;card.y=card.hy;}},
    update(){if(card&&!said&&!drag){said=true;setTimeout(()=>{if(card)say(card.label);},450);}},
    draw(){const {x,w,h}=G,now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;scene(x,w,h,C.bg);
      for(const b of bins()){x.fillStyle=b.col||'#fff8ea';x.strokeStyle='#3b2417';x.lineWidth=3;rrect(x,b.X-b.W/2,b.Y-b.H/2,b.W,b.H,20);x.fill();x.stroke();emo(x,b.e,b.X,b.Y-12,46);lbl(x,b.label,b.X,b.Y+40,17);}
      if(card){const cw=Math.min(220,w*.6),ch=170;x.save();x.translate(card.x,card.y);x.rotate(drag?Math.sin(now/120)*.04:0);x.fillStyle='#fff';x.strokeStyle='#3b2417';x.lineWidth=3;rrect(x,-cw/2,-ch/2,cw,ch,22);x.fill();x.stroke();emo(x,card.e,0,-22,70);
        x.font='800 17px "Nunito",sans-serif';x.fillStyle='#3b2417';x.textAlign='center';const words=card.label.split(' ');let line='',lines=[];for(const wd of words){const t=line?line+' '+wd:wd;if(x.measureText(t).width>cw-24){lines.push(line);line=wd;}else line=t;}lines.push(line);const nl=Math.min(3,lines.length);lines.slice(0,3).forEach((l,k)=>x.fillText(l,0,48+k*19-(nl-1)*9));x.restore();}
      drawFx(x,fx,dt);counter(G,x,Math.min(i+1,cards.length)+' / '+cards.length);}};
},
/* ---------- CHẠM ĐÚNG ---------- */
tap(G,C){
  let pop=[],got=0,next=.6,t=0,fx=[],happy=[],last=performance.now(),sayT=0;
  const spots=()=>{const {w,h}=G,a=[];const cols=3,rows=3,top=h*(C.top||.3),bot=h-150;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)a.push({x:w*(c+.5)/cols,y:top+(bot-top)*(r+.5)/rows});return a;};
  return{get _pop(){return pop},down(p){for(const o of pop){if(o.hit||o.t>o.life)continue;if(Math.hypot(o.x-p.x,o.y-p.y)<44){o.hit=true;
      if(o.good){got++;ding();sparkle(fx,o.x,o.y);happy.push({x:o.x,y:o.y,t:0,e:C.happy||'💖'});if(o.say&&performance.now()-sayT>900){sayT=performance.now();say(o.say);G.hint(o.say);}if(got>=C.need){G.hint(C.doneHint||'Giỏi quá!');G.win();}}

function btn(x,X,Y,W,H,txt,on){x.fillStyle=on?'#e0322a':'#fff8ea';x.strokeStyle='#3b2417';x.lineWidth=3;rrect(x,X,Y,W,H,14);x.fill();x.stroke();x.font='800 17px "Baloo 2",sans-serif';x.fillStyle=on?'#fff':'#3b2417';x.textAlign='center';x.fillText(txt,X+W/2,Y+H/2+6);}
function wrapText(x,t,cx,cy,maxW,lh){const ws=t.split(' ');let line='',out=[];for(const w of ws){const s=line?line+' '+w:w;if(x.measureText(s).width>maxW&&line){out.push(line);line=w;}else line=s;}out.push(line);out.forEach((l,i)=>x.fillText(l,cx,cy+(i-(out.length-1)/2)*lh));}

recall(G,C){
  const RD=C.rounds.map(x=>({day:x.day,need:shuffle(C.books.map(o=>o.id)).slice(0,x.need.length)}));let r=0,phase='show',showT=0,picked=[],fx=[],last=performance.now();
  const round=()=>RD[r];
  const opts=()=>{const {w,h}=G,o=C.books,cols=3,cw=Math.min(110,(w-40)/3);return o.map((b,i)=>({...b,X:w/2+((i%cols)-1)*(cw+10),Y:h*.5+Math.floor(i/cols)*(cw+16),cw}));};
  function start(){if(!round())return;phase='show';showT=C.showFor||5;picked=[];say(round().day+'. '+round().need.join(', ')+'.');G.hint('Nhớ kỹ các môn học nhé!');}
  start();

memory(G,C){
  let cards=[],open=[],lock=0,pairs=0,fx=[],last=performance.now();
  C.pairs.forEach((p,i)=>{cards.push({k:i,f:p[0],up:false,done:false});cards.push({k:i,f:p[1],up:false,done:false});});cards.sort(()=>Math.random()-.5);
  const L=()=>{const {w,h}=G,n=cards.length,cols=n>8?4:4,rows=Math.ceil(n/cols),cw=Math.min(82,(w-40)/cols-8),ch=cw*1.2,top=(h-180-rows*(ch+8))/2+30;return cards.map((c,j)=>({c,X:w/2+((j%cols)-(cols-1)/2)*(cw+8),Y:top+Math.floor(j/cols)*(ch+8)+ch/2,cw,ch}));};
  return{get _next(){const l=L();for(const a of l){if(a.c.done)continue;const b=l.find(o=>o!==a&&o.c.k===a.c.k&&!o.c.done);if(b)return[a.X,a.Y,b.X,b.Y];}return null;},down(p){if(lock>0)return;for(const o of L()){const c=o.c;if(c.up||c.done)continue;if(Math.abs(p.x-o.X)<o.cw/2&&Math.abs(p.y-o.Y)<o.ch/2){c.up=true;open.push(c);tone(600,.05,'triangle',.03);if(C.speak&&c.f.length>2)say(c.f);
      if(open.length===2){const [a,b]=open;if(a.k===b.k){a.done=b.done=true;open=[];pairs++;ding();sparkle(fx,o.X,o.Y);const m=C.pairSay?C.pairSay[a.k]:'Đúng cặp rồi!';say(m);G.hint(m);if(pairs===C.pairs.length){G.hint(C.doneHint);G.win();}}
        else{lock=.9;setTimeout(()=>{a.up=b.up=false;open=[];},850);if(C.countMiss)oops();}}return;}}},
    update(dt){lock=Math.max(0,lock-dt);},
    draw(){const {x,w,h}=G,now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;scene(x,w,h,C.bg||'home');
      for(const o of L()){const c=o.c;x.fillStyle=c.done?'#e9f6e4':(c.up?'#fff':'#e0322a');x.strokeStyle='#3b2417';x.lineWidth=3;rrect(x,o.X-o.cw/2,o.Y-o.ch/2,o.cw,o.ch,12);x.fill();x.stroke();
        if(c.up||c.done){if(/^[0-9]/.test(c.f)||c.f.length>3){x.fillStyle='#3b2417';x.font='800 '+(c.f.length>4?14:24)+'px "Baloo 2",sans-serif';x.textAlign='center';wrapText(x,c.f,o.X,o.Y+6,o.cw-8,16);}else emo(x,c.f,o.X,o.Y,o.cw*.55);}
        else{flowerAt(x,o.X,o.Y,o.cw*.25);}}
      drawFx(x,fx,dt);counter(G,x,pairs+' / '+C.pairs.length+' cặp');}};
}

const ENG3={
multi(G,C){
  let st=[],done=0,fx=[],last=performance.now(),t=0;
  function init(){const {w,h}=G,n=C.stations.length,cols=Math.min(n,3),rows=Math.ceil(n/cols),cw=Math.min(118,(w-32)/cols-10);
    st=C.stations.map((s,i)=>({...s,X:w/2+((i%cols)-(cols-1)/2)*(cw+10),Y:h*.3+Math.floor(i/cols)*(cw+70),cw,p:0,state:'wait',wait:R(.3,2.5)+i*.6,got:0}));}
  init();
  const need=()=>C.need||st.length*2;
  return{get _st(){return st},resize:init,
    down(p){for(const s of st){if(Math.abs(p.x-s.X)<s.cw/2&&Math.abs(p.y-s.Y)<s.cw/2+20){
      if(s.state!=='cook')return;
      if(s.p>=C.lo&&s.p<=C.hi){s.state='wait';s.wait=R(1.2,3);s.p=0;done++;ding();sparkle(fx,s.X,s.Y);say(s.ok||'Chín vừa rồi!');if(done>=need()){G.hint(C.doneHint);G.win();}}
      else if(s.p<C.lo){oops();const m=s.raw||'Chưa chín đâu, con chờ thêm chút nhé.';G.hint(m);say(m);}
      return;}}},
    update(dt){t+=dt;for(const s of st){if(s.state==='wait'){s.wait-=dt;if(s.wait<=0&&done<need()){s.state='cook';s.p=0;tone(500,.1,'sine',.03);}}
      else if(s.state==='cook'){s.p+=dt/(s.dur||C.dur||4);if(s.p>1){s.state='burn';s.bt=1.4;oops();const m=s.burnt||'Ối, để quá lâu cháy mất rồi!';G.hint(m);say(m);}}
      else if(s.state==='burn'){s.bt-=dt;if(s.bt<=0){s.state='wait';s.wait=R(.8,1.8);s.p=0;}}}},
    draw(){const {x,w,h}=G,now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;scene(x,w,h,C.bg||'kitchen');
      for(const s of st){x.fillStyle=s.state==='burn'?'#3b2417':'#fff8ea';x.strokeStyle='#3b2417';x.lineWidth=3;rrect(x,s.X-s.cw/2,s.Y-s.cw/2,s.cw,s.cw,16);x.fill();x.stroke();

        const bx=s.X-s.cw/2,by=s.Y+s.cw/2+8,bw=s.cw;x.fillStyle='#fff';rrect(x,bx,by,bw,14,7);x.fill();x.strokeStyle='#3b2417';x.lineWidth=2;x.stroke();
        x.fillStyle='rgba(61,139,79,.35)';x.fillRect(bx+bw*C.lo,by+1,bw*(C.hi-C.lo),12);
        if(s.state==='cook'){x.fillStyle=s.p<C.lo?'#f0a52a':(s.p<=C.hi?'#3d8b4f':'#e0322a');rrect(x,bx,by,bw*Math.min(1,s.p),14,7);x.fill();if(s.p>=C.lo&&s.p<=C.hi&&Math.sin(now/90)>0)emo(x,'✨',s.X+s.cw/2-10,s.Y-s.cw/2+10,22);}

budget(G,C){
  const RS=shuffle(C.rounds).slice(0,C.pick||C.rounds.length).map(rd=>{const shelf=shuffle(rd.shelf).map(o=>({...o,p:Math.max(1000,Math.round(o.p*R(.8,1.25)/1000)*1000)}));const min=rd.need.reduce((a,n)=>a+Math.min(...shelf.filter(o=>o.n===n).map(o=>o.p)),0);return{...rd,shelf,money:Math.max(min,Math.ceil(min*R(1.08,1.3)/5000)*5000)};});
  let bag=[],fx=[],last=performance.now(),r=0;
  const fmt=v=>v.toLocaleString('vi-VN')+'đ';
  const rd=()=>RS[r];
  const L=()=>{const {w,h}=G,it=rd()?rd().shelf:[],cols=3,cw=Math.min(112,(w-32)/cols-8),ch=86;return{shelf:it.map((o,j)=>({...o,X:w/2+((j%cols)-1)*(cw+8),Y:h*.4+Math.floor(j/cols)*(ch+8),cw,ch})),pay:{X:w/2-80,Y:h-178,W:160,H:44}};};
  const total=()=>bag.reduce((a,b)=>a+b.p,0);
  function ask(){const x=rd();if(!x)return;const m='Mẹ dặn mua: '+x.need.join(', ')+'. Con có '+fmt(x.money)+'.';say(m);G.hint(m);}
  setTimeout(ask,500);
  return{get _next(){const x=rd();if(!x)return null;const l=L();const miss=x.need.find(n=>!bag.some(b=>b.n===n));if(!miss)return[l.pay.X+80,l.pay.Y+22];const cand=l.shelf.filter(o=>o.n===miss).sort((a,b)=>a.p-b.p)[0];return[cand.X,cand.Y];},
    down(p){const l=L(),x=rd();if(!x)return;
      for(const o of l.shelf){if(Math.abs(p.x-o.X)<o.cw/2&&Math.abs(p.y-o.Y)<o.ch/2){const j=bag.findIndex(b=>b.id===o.id);if(j>=0){bag.splice(j,1);tone(400,.05);}else{bag.push({id:o.id,n:o.n,p:o.p});tone(700,.05,'triangle',.03);if(!x.need.includes(o.n)){const m=o.n+' mẹ không dặn mua đâu con.';say(m);G.hint(m);}}return;}}
      const P=l.pay;if(p.x>P.X&&p.x<P.X+P.W&&p.y>P.Y&&p.y<P.Y+P.H){
        const miss=x.need.filter(n=>!bag.some(b=>b.n===n)),extra=bag.filter(b=>!x.need.includes(b.n));
        if(miss.length){oops();const m='Còn thiếu: '+miss.join(', ')+'.';say(m);G.hint(m);return;}
        if(extra.length){oops();const m='Bỏ bớt đồ mẹ không dặn nhé: '+extra.map(e=>e.n).join(', ')+'.';say(m);G.hint(m);return;}
        if(total()>x.money){oops();const m='Quá số tiền rồi! Con chọn món rẻ hơn nhé.';say(m);G.hint(m);return;}
        ding();sparkle(fx,G.w/2,G.h*.25);const m='Đúng rồi! Còn thừa '+fmt(x.money-total())+'.';say(m);G.hint(m);r++;bag=[];if(r>=RS.length){G.hint(C.doneHint);G.win();}else setTimeout(ask,1500);}},
    draw(){const {x,w,h}=G,now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;scene(x,w,h,'shop');const X=rd()||RS[RS.length-1],l=L();
      x.fillStyle='#fff';x.strokeStyle='#3b2417';x.lineWidth=3;rrect(x,16,52,w-32,h*.4-100,14);x.fill();x.stroke();
      x.fillStyle='#e0322a';x.font='800 17px "Baloo 2",sans-serif';x.textAlign='center';x.fillText('Mẹ dặn mua · có '+fmt(X.money),w/2,76);
      x.font='800 15px "Nunito",sans-serif';X.need.forEach((n,i)=>{const got=bag.some(b=>b.n===n);x.fillStyle=got?'#3d8b4f':'#3b2417';x.fillText((got?'✓ ':'• ')+n,w/2,98+i*20);});
      for(const o of l.shelf){const inb=bag.some(b=>b.id===o.id);x.fillStyle=inb?'#e9f6e4':'#fff8ea';x.strokeStyle=inb?'#3d8b4f':'#3b2417';x.lineWidth=inb?4:2.5;rrect(x,o.X-o.cw/2,o.Y-o.ch/2,o.cw,o.ch,12);x.fill();x.stroke();emo(x,o.e,o.X,o.Y-14,34);x.fillStyle='#3b2417';x.font='800 12px "Nunito",sans-serif';x.fillText(o.n,o.X,o.Y+18);x.fillStyle='#e0322a';x.font='800 13px "Nunito",sans-serif';x.fillText(fmt(o.p),o.X,o.Y+34);}
      x.fillStyle=total()>X.money?'#e0322a':'#3b2417';x.font='800 16px "Nunito",sans-serif';x.fillText('Giỏ hàng: '+fmt(total())+' / '+fmt(X.money),w/2,l.pay.Y-14);

const DIFF={de:{name:'Dễ',t:1.5,n:.7,life:1.3,every:1.2,show:1.4,dur:1.3,win:.06},vua:{name:'Vừa',t:1,n:1,life:1,every:1,show:1,dur:1,win:0},kho:{name:'Khó',t:.75,n:1.3,life:.8,every:.85,show:.7,dur:.8,win:-.04}};
function applyDiff(g){const d=DIFF[(DUEL&&DUEL.diff)||S.diff]||DIFF.vua;if(!g.cfg)return g.cfg;const c={...g.cfg};if(d===DIFF.vua)return c;const de=d===DIFF.de;
  const cut=a=>a&&a.length>1?a.slice(0,Math.max(1,Math.round(a.length*.7))):a;
  const shuf=a=>a.slice().sort(()=>Math.random()-.5);
  if(c.time)c.time=Math.round(c.time*d.t);
  if(c.need)c.need=Math.max(3,Math.round(c.need*d.n));
  if(g.eng==='catch'&&c.need)c.need=Math.min(c.need,18);
  if(c.life)c.life*=d.life;if(c.every)c.every*=d.every;if(c.showFor)c.showFor*=d.show;
  if(c.lightT)c.lightT*=d.dur;
  if(g.eng==='tap'&&!c.life)c.life=2.6*d.life;
  if(g.eng==='multi'){c.dur=(c.dur||4)*d.dur;c.stations=c.stations.map(s=>({...s,dur:s.dur?s.dur*d.dur:undefined}));c.lo=c.lo-d.win;c.hi=c.hi+d.win;}
  if(g.eng==='find'){c.n=Math.max(3,Math.round(c.n*d.n));c.m=Math.max(2,Math.round(c.m*(de?.6:1.3)));}
  if(g.eng==='needs'){c.count=Math.min(c.needs.length,Math.max(3,Math.round((c.count||c.needs.length)*d.n)));}
  if(g.eng==='fill')c.n=Math.max(2,Math.min(4,(c.n||3)+(de?-1:1)));
  if(g.eng==='scrub'&&c.spots)c.spots=Math.round(c.spots*d.n);
  if(g.eng==='rhythm'&&de)c.okMiss=(c.okMiss??3)+2;
  if(de){
    if(g.eng==='seq')c.decoys=[];
    if(g.eng==='drag'&&c.items.length>4)c.items=shuf(c.items).slice(0,Math.max(4,Math.round(c.items.length*.7)));
    if(g.eng==='sort')c.cards=shuf(c.cards).slice(0,Math.max(3,Math.round(c.cards.length*.7)));
    if(c.pick)c.pick=Math.max(1,Math.round(c.pick*.7));if(c.genN)c.genN=Math.max(1,Math.round(c.genN*.7));
    ['rounds','qs','words','pairs'].forEach(k=>{if(c[k]&&!c.pick&&!c.gen&&g.eng!=='recall')c[k]=cut(c[k]);});
    if(g.eng==='swipe')c.items=cut(c.items);
    if(g.eng==='word')c.nExtra=Math.max(0,(c.nExtra||2)-1);
  }else{
    if(g.eng==='word')c.nExtra=(c.nExtra||2)+2;
    if(g.eng==='seq')c.nDecoy=3;
    if(c.pick){const pool=c.qs||c.rounds||c.words;if(pool)c.pick=Math.min(pool.length,c.pick+1);}
    if(c.genN)c.genN++;
    if(g.eng==='swipe'&&c.seq)c.seq=[...c.seq,c.seq[0]];
  }
  return c;}

function spotMath(big){const lines=[];const make=()=>{const op=pick(['+','−','×',':']);let a,b,c;
    if(op==='+'){a=big?ri(100,700):ri(10,60);b=big?ri(50,300):ri(5,39);c=a+b;}
    else if(op==='−'){a=big?ri(200,900):ri(30,99);b=big?ri(50,a-20):ri(5,a-5);c=a-b;}
    else if(op==='×'){a=big?ri(12,45):ri(2,9);b=ri(2,9);c=a*b;}
    else{b=ri(2,9);c=big?ri(11,40):ri(2,9);a=b*c;}
    return{a,b,c,op};};
  for(let i=0;i<5;i++)lines.push(make());const bad=shuffle([0,1,2,3,4]).slice(0,2);
  return lines.map((l,i)=>{if(!bad.includes(i))return{t:`${l.a} ${l.op} ${l.b} = ${l.c}`};const w=l.c+pick(big?[-10,10,-2,2,1]:[-2,-1,1,2,10]);return{t:`${l.a} ${l.op} ${l.b} = ${Math.max(0,w===l.c?l.c+1:w)}`,bad:true,why:`${l.a} ${l.op==='−'?'trừ':l.op==='+'?'cộng':l.op==='×'?'nhân':'chia'} ${l.b} bằng ${l.c} mới đúng.`};});}

  addEventListener('resize',onR);

  const loop=now=>{if(!alive)return;const dt=Math.min(.05,(now-last)/1000);last=now;game.update&&game.update(dt);game.draw();
    if(TT){if(!finished){tLeft=Math.max(0,tLeft-dt);if(tLeft<=0){finished=true;timeUp(g);}}const k=tLeft/TT,bw=Math.max(60,w-150);x.fillStyle='rgba(255,248,234,.94)';rrect(x,12,12,bw,30,12);x.fill();x.strokeStyle='#3b2417';x.lineWidth=2;x.stroke();x.fillStyle=k>.5?'#3d8b4f':(k>.25?'#f0a52a':'#e0322a');rrect(x,40,20,(bw-36)*k,14,7);x.fill();emo(x,'⏰',26,27,18);}
    raf=requestAnimationFrame(loop);};

}

    move(p){if(!drag)return;drag.d.x=p.x-drag.ox;drag.d.y=p.y-drag.oy;drag.d.r*=.9;},
    up(){if(!drag)return;const d=drag.d;let best=null;
      for(const s of slots)for(let k=0;k<2;k++){if(s.filled[k])continue;const q=slotPos(s,k);const dist=Math.hypot(q.x-d.x,q.y-d.y);if(dist<50&&(!best||dist<best.dist))best={s,k,dist,q};}
      if(best&&best.s.col===d.col){best.s.filled[best.k]=d;d.placed=true;d.x=best.q.x;d.y=best.q.y;d.r=0;left--;ding();
        if(left===0){G.hint('Kệ dép gọn gàng rồi!');G.win();}else if(left===4){G.hint('Được một nửa rồi! Con cố lên nhé.');say('Được một nửa rồi! Cố lên con.');}}
      else if(best){oops();d.x=drag.sx;d.y=drag.sy;G.hint('Chưa đúng màu rồi. Dép đỏ để chỗ đỏ, dép xanh để chỗ xanh nhé.');say('Chưa đúng màu rồi con ơi.');}
      drag=null;},
    draw(){const {x,w,h}=G;x.fillStyle='#f6dc8c';x.fillRect(0,0,w,h*.38);x.fillStyle='#e9d4ad';x.fillRect(0,h*.38,w,h);
      x.fillStyle='rgba(120,80,40,.15)';for(let i=0;i<w;i+=40)x.fillRect(i,h*.38,2,h);
      // kệ
      const sw=Math.min(78,(w-40)/4);x.fillStyle='#8a5a2a';x.fillRect(w/2-2*(sw+8)-10,h*.2+38,4*(sw+8)+20,12);x.fillRect(w/2-2*(sw+8)-10,h*.2-50,10,100);x.fillRect(w/2+2*(sw+8),h*.2-50,10,100);
      x.fillStyle='#3b2417';x.font='800 17px "Baloo 2",sans-serif';x.textAlign='center';x.fillText('Kệ dép',w/2,h*.2-58);
      for(const s of slots)for(let k=0;k<2;k++){if(!s.filled[k]){const q=slotPos(s,k);slipper(x,q.x,q.y,s.col,0,1,true);}}
      for(const d of sl)slipper(x,d.x,d.y,d.col,d.r,drag&&drag.d===d?1.15:1);
    }};
}
};

function stage(draw,onDown,extra){
  clear();screen.innerHTML='<canvas id="game"></canvas>'+(extra||'');const c=$('#game');let {x,w,h}=setupCanvas(c);let alive=true,raf=0,last=performance.now();
  const ctx={get x(){return x},get w(){return w},get h(){return h}};
  const onR=()=>{({x,w,h}=setupCanvas(c));};addEventListener('resize',onR);
  const loop=now=>{if(!alive)return;const dt=Math.min(.05,(now-last)/1000);last=now;draw(ctx,dt,now);raf=requestAnimationFrame(loop);};raf=requestAnimationFrame(loop);
  const pos=e=>{const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
  c.onpointerdown=e=>{e.preventDefault();audio();onDown&&onDown.down&&onDown.down(pos(e),ctx);};
  c.onpointermove=e=>{onDown&&onDown.move&&onDown.move(pos(e),ctx,e.buttons||e.pressure>0);};
  c.onpointerup=c.onpointercancel=e=>{onDown&&onDown.up&&onDown.up(pos(e),ctx);};
  stopGame=()=>{alive=false;cancelAnimationFrame(raf);removeEventListener('resize',onR);};return ctx;}

const IMG={db:undefined,mem:{},
  open(){if(this.db!==undefined)return Promise.resolve(this.db);return new Promise(res=>{try{const q=indexedDB.open('bengoan_img',1);q.onupgradeneeded=()=>q.result.createObjectStore('img');q.onsuccess=()=>{this.db=q.result;res(this.db);};q.onerror=()=>{this.db=null;res(null);};}catch(e){this.db=null;res(null);}});},
  async put(id,d){this.mem[id]=d;const db=await this.open();if(!db)return;try{db.transaction('img','readwrite').objectStore('img').put(d,id);}catch(e){}},
  async get(id){if(this.mem[id])return this.mem[id];const db=await this.open();if(!db)return null;return new Promise(res=>{try{const q=db.transaction('img').objectStore('img').get(id);q.onsuccess=()=>{if(q.result)this.mem[id]=q.result;res(q.result||null);};q.onerror=()=>res(null);}catch(e){res(null);}});}};
function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  const hc=document.createElement('canvas');hc.width=9;hc.height=8;const hx=hc.getContext('2d');hx.drawImage(im,0,0,9,8);const p=hx.getImageData(0,0,9,8).data;let bits='';for(let y=0;y<8;y++)for(let xx=0;xx<8;xx++){const i=(y*9+xx)*4,j=i+4;bits+=(p[i]+p[i+1]+p[i+2])>(p[j]+p[j+1]+p[j+2])?'1':'0';}
  URL.revokeObjectURL(u);res({data:c.toDataURL('image/jpeg',.75),hash:bits});};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'));};im.src=u;});}
const ham=(a,b)=>{let n=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i])n++;return n;};
const pdate=t=>{const d=new Date(t);return d.getDate()+'/'+(d.getMonth()+1)+' lúc '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');};

    t2.pend[k]=1;save();ding();say('Con giỏi quá! Nhờ bố mẹ xem rồi tặng hoa cho con nhé.');home();});
  thumb($('#bPhieu canvas'),'phieu');thumb($('#bMe canvas'),'me');thumb($('#bRew canvas'),'gift');thumb($('#bAlb canvas'),'cam');thumb($('#bDuel canvas'),'cup');
  $('#bPhieu').onclick=()=>{audio();phieu();};$('#bMe').onclick=()=>{audio();gate();};$('#bRew').onclick=()=>{audio();rewards();};$('#bAlb').onclick=()=>{audio();album();};$('#bDuel').onclick=()=>{audio();duelSetup();};
  $('#bWho').onclick=()=>{audio();if(ALL.kids.length>1)profiles();else addKid();};
  if($('#bTz'))$('#bTz').onclick=()=>{audio();rewards();};
  say(first?`Chào bé ${kidName()}! Con chạm vào một trò để giúp mẹ, giúp bà nhé.`:`Bé ${kidName()} muốn chơi trò gì tiếp nào?`);
}

/* ---------- phiếu bé ngoan ---------- */
function phieu(){
  clear();setBar('Phiếu bé ngoan',true);
  const now=new Date(),dow=(now.getDay()+6)%7,names=['T2','T3','T4','T5','T6','T7','CN'];let cells='',week=0;
  weekKeys().forEach((d,i)=>{const r=S.days[dkey(d)];const n=r?Object.keys(r.games).length+Object.keys(r.tasks).length:0;week+=n;
    cells+=`<div class="day${i===dow?' today':''}"><i>${names[i]}</i><i>${d.getDate()}/${d.getMonth()+1}</i><div class="fl">${FLOWER.repeat(Math.min(n,9))}</div>${n?`<b class="dn">${n}</b>`:''}</div>`;});
  const goal=ALL.goal||15;
  const board=ALL.kids.length>1?`<div class="card"><h2>Bảng thi đua nhà mình tuần này</h2>${ALL.kids.map((k,i)=>({k,i,w:kidWeek(k)})).sort((a,b)=>b.w-a.w).map((o,j)=>`<div class="rk"><span class="md">${['🥇','🥈','🥉','🏅','🏅','🏅'][j]||'🏅'}</span><canvas data-av="${o.i}"></canvas><b>${esc(o.k.name)}</b><small>${o.w} hoa${o.w>=goal?' · Bé ngoan của tuần!':''}</small></div>`).join('')}</div>`:'';
  screen.innerHTML=`<div class="pad"><div class="phieu"><h2>PHIẾU BÉ NGOAN</h2><p class="who">Bé ${esc(kidName())} · tuần này</p><div class="week">${cells}</div>
  <p class="total">Tuần này con được ${week} hoa. ${week>=goal?'Con là bé ngoan của tuần!':'Còn '+(goal-week)+' hoa nữa là đạt bé ngoan của tuần.'}</p><div class="prog"><div style="width:${Math.min(100,week/goal*100)}%"></div></div><p class="small center" style="margin:6px 0 0">Mục tiêu bố mẹ đặt: ${goal} hoa mỗi tuần</p></div>
  ${board}<p class="note">Mỗi trò chơi được 1 hoa mỗi ngày. Việc thật bố mẹ giao cũng được 1 hoa khi bố mẹ xác nhận.</p></div>`;
  paintAvatars();
  say(week>=goal?`Tuần này con được ${week} bông hoa. Con là bé ngoan của tuần!`:`Tuần này con được ${week} bông hoa đỏ. Con cố lên nhé!`);
}

/* ---------- góc của bố mẹ ---------- */
function parents(){
  clear();setBar('Góc của bố mẹ',true);fixS();
  const t=todayRec(),tk=today();
  const pend=[];ALL.kids.forEach((k,i)=>(k.photos||[]).forEach(p=>{if(p.st==='pend')pend.push({k,i,p});}));
  screen.innerHTML=`<div class="pad">
  <div class="card"><h2>Các bé trong nhà</h2><p>Bố mẹ đang xem việc của: <b>bé ${esc(kidName())}</b>. Chạm vào bé khác để giao việc cho bé đó.</p>
   ${ALL.kids.map((k,i)=>`<div class="task kidrow${i===ALL.cur?' cur':''}"><canvas data-av="${i}"></canvas><span data-sw="${i}">${esc(k.name||'Bé')}<small class="tag">${kidTotal(k)} hoa · ${okPhotos(k)} ảnh được duyệt</small></span><button class="btn" data-ed="${i}">Sửa</button>${ALL.kids.length>1?`<button class="btn" data-del="${i}" aria-label="Xóa bé">✕</button>`:''}</div>`).join('')}
   <div class="row" style="margin-top:8px"><button class="btn red" id="kAdd">+ Thêm bé</button></div></div>
  <div class="card"><h2>Duyệt ảnh thành tích ${pend.length?`<span class="badge">${pend.length}</span>`:''}</h2><p>Bé chụp ảnh phiếu bé ngoan hoặc bài điểm 10. Mỗi bé chỉ được duyệt <b>1 ảnh mỗi ngày</b>, nên muốn mở phần thưởng bé phải cố gắng nhiều ngày.</p>
   ${pend.length?pend.map(({k,i,p})=>{const done=(k.photos||[]).some(q=>q.st==='ok'&&q.ad===tk);return `<div class="apv" data-pid="${p.id}" data-ki="${i}"><img data-img="${p.id}" alt="Ảnh bé chụp"><div><b>Bé ${esc(k.name)}</b><small>Chụp ${pdate(p.t)}</small>
     <div class="row"><button class="btn chip" data-kind="phieu">Phiếu bé ngoan</button><button class="btn chip" data-kind="diem10">Điểm 10</button></div>
     <div class="row subj" hidden>${['Toán','Tiếng Việt','Tiếng Anh','Môn khác'].map(s=>`<button class="btn chip" data-subj="${s}">${s}</button>`).join('')}</div>
     ${done?`<small class="warn">Hôm nay đã duyệt 1 ảnh cho bé ${esc(k.name)}. Mai bố mẹ duyệt tiếp nhé.</small>`:''}
     <div class="row"><button class="btn red" data-ok disabled>Duyệt</button><button class="btn" data-no>Không duyệt</button></div></div></div>`;}).join(''):'<p class="small">Chưa có ảnh nào chờ duyệt.</p>'}</div>
  <div class="card"><h2>Việc thật hôm nay của bé ${esc(kidName())}</h2><p>Bé làm xong việc nào thì bấm "Bé đã làm" để tặng 1 hoa. Bấm ✕ để bỏ việc khỏi danh sách.</p>${S.tasks.length?"":"<p>Chưa có việc nào. Bố mẹ mở thư viện để giao việc cho bé.</p>"}
  <div id="tl">${S.tasks.map((k,i)=>`<div class="task"><span>${k}${t.pend[k]&&!t.tasks[k]?'<small class="tag" style="color:#b0281f;opacity:1">Bé báo đã làm xong</small>':''}</span>${t.tasks[k]?'<span class="done">Đã tặng hoa</span>':`<button class="btn red" data-t="${i}">Bé đã làm</button>`}<button class="btn" data-rm="${i}" aria-label="Bỏ việc này">✕</button></div>`).join('')}</div>
  <div class="row" style="margin-top:8px"><input id="newT" maxlength="40" placeholder="Tự thêm việc, ví dụ: Tự mặc quần áo" aria-label="Tên việc mới"><button class="btn" id="addT">Thêm</button></div></div>
  <div class="card"><h2>Thư viện việc tốt</h2><p>120 việc ở nhà, ở trường và ngoài xã hội. Bố mẹ chọn việc hợp với bé, không phụ thuộc tuổi.</p><button class="btn red" id="openLib">Mở thư viện</button></div>
  <div class="card"><h2>Mục tiêu bé ngoan của tuần</h2><p>Đạt số hoa này trong tuần thì bé là "Bé ngoan của tuần".</p><div class="row">${[15,30,50,80].map(n=>`<button class="btn chip${(ALL.goal||15)===n?' on':''}" data-goal="${n}">${n} hoa</button>`).join('')}</div></div></div>`;
  paintAvatars();loadImgs();
  screen.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{useKid(+b.dataset.sw);parents();});
  screen.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{editKid(+b.dataset.ed,false,parents);});
  screen.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const i=+b.dataset.del;if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='Xóa hẳn?';b.classList.add('red');return;}
    ALL.kids.splice(i,1);useKid(Math.min(ALL.cur>i?ALL.cur-1:ALL.cur,ALL.kids.length-1));parents();});
  $('#kAdd').onclick=()=>{addKid();};
  screen.querySelectorAll('.apv').forEach(el=>{const k=ALL.kids[+el.dataset.ki],p=(k.photos||[]).find(q=>q.id===el.dataset.pid);let kind=null,subj=null;const done=(k.photos||[]).some(q=>q.st==='ok'&&q.ad===tk);const okB=el.querySelector('[data-ok]');
    const upd=()=>{el.querySelectorAll('[data-kind]').forEach(b=>b.classList.toggle('on',b.dataset.kind===kind));el.querySelector('.subj').hidden=kind!=='diem10';el.querySelectorAll('[data-subj]').forEach(b=>b.classList.toggle('on',b.dataset.subj===subj));okB.disabled=done||!kind||(kind==='diem10'&&!subj);};
    el.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;upd();});el.querySelectorAll('[data-subj]').forEach(b=>b.onclick=()=>{subj=b.dataset.subj;upd();});
    okB.onclick=()=>{if(okB.disabled)return;p.st='ok';p.ad=tk;p.kind=kind;p.subj=kind==='diem10'?subj:'';save();fanfare();say('Đã duyệt ảnh cho bé '+k.name+'. Bé giỏi lắm!');const y=screen.scrollTop;parents();screen.scrollTop=y;};
    el.querySelector('[data-no]').onclick=()=>{p.st='no';save();const y=screen.scrollTop;parents();screen.scrollTop=y;};upd();});
  screen.querySelectorAll('[data-t]').forEach(bn=>bn.onclick=()=>{const k=S.tasks[+bn.dataset.t];delete todayRec().pend[k];if(giveFlower('tasks',k)){fanfare();say('Bé '+kidName()+' được thêm một bông hoa vì đã '+k.toLowerCase()+'. Giỏi quá!');}parents();});
  $('#addT').onclick=()=>{const v=esc($('#newT').value).trim();if(v&&!S.tasks.includes(v)){S.tasks.push(v);save();}parents();};
  $('#openLib').onclick=()=>{library();};
  screen.querySelectorAll('[data-rm]').forEach(bn=>bn.onclick=()=>{S.tasks.splice(+bn.dataset.rm,1);save();parents();});
  screen.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{ALL.goal=+b.dataset.goal;save();parents();});
}
function start(){if(!ALL.kids.length){pickKid();return;}if(ALL.kids.length>1){profiles();return;}useKid(0);if(!S.kid||!S.name)editKid(0,true);else home(true);}

window.__GEN=GEN;window.__GAMES=GAMES;window.__T={get ALL(){return ALL},get S(){return S},get DUEL(){return DUEL},IMG,today};
drawFl();
start();
})();
</script>

</body>
