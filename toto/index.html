<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tô Tô</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14532d">
<link rel="icon" href="../icon-192.png">
<style>
:root{--bg:#f3f5f1;--fg:#1d2420;--mut:#6b766f;--acc:#1f7a4d;--card:#fff;--up:#1f7a4d;--dn:#c0392b;--line:#e3e7e1}
@media (prefers-color-scheme:dark){:root{--bg:#121614;--fg:#e8ede9;--mut:#8b968f;--acc:#3fbf7f;--card:#1b211e;--up:#3fbf7f;--dn:#ef6b5e;--line:#2a322d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:22px}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;font:inherit}
.price{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;margin:6px 0 0}
.sub{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.lv{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;padding:2px 0}
.up{color:var(--up)}.dn{color:var(--dn)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}td,th{padding:3px 2px;text-align:right}th{color:var(--mut);font-weight:500}td:first-child,th:first-child{text-align:left}
#alert{display:none;background:#fde8e6;color:#8a1f15;border-radius:12px;padding:10px 12px;margin-top:10px;font-weight:600}
@media (prefers-color-scheme:dark){#alert{background:#3a1c19;color:#ffb4ab}}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600}
.btn.alt{background:transparent;color:var(--acc);border:1px solid var(--acc)}
#log{white-space:pre-wrap;font-size:13px;color:var(--mut);max-height:220px;overflow:auto}
#set{display:none}label{display:block;margin-top:8px;font-size:13px;color:var(--mut)}
input{width:100%;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.m{margin:6px 0}.m.a{border-left:3px solid var(--acc);padding-left:8px}
</style>
</head>
<body><div class="wrap">
<header><h1>Tô Tô</h1><button class="link" id="tg">Cài đặt</button></header>
<section id="set" class="card">
<div class="sub">Khóa Gemini, cầu nối và mật khẩu dùng chung với An (nhập ở An là đủ). Ở đây chỉ chỉnh giọng Tô Tô.</div>
<label>Giọng Tô Tô (Puck, Charon, Fenrir, Orus...)</label><input id="vc">
<div class="row"><button class="btn" id="sv">Lưu</button></div>
</section>
<div class="price" id="px">—</div><div class="sub" id="meta">Đang chờ số liệu từ MT5…</div>
<div id="alert"></div>
<div class="card"><b>Cản gần nhất</b><div id="near"></div></div>
<div class="card"><b>Lệnh đang mở</b><div id="pos" class="sub">—</div></div>
<div class="card"><table id="tb"></table></div>
<div class="row"><button class="btn" id="talk">Nói với Tô Tô</button><button class="btn alt" id="spk">🔊 Đọc cảnh báo: bật</button></div>
<div class="card"><b>Nhật ký Tô Tô</b><div id="log"></div></div>
<div id="chat"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const A=k=>{try{return localStorage.getItem('an_'+k)||''}catch(e){return''}};
const T={get:(k,d='')=>{try{return localStorage.getItem('toto_'+k)??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem('toto_'+k,v)}catch(e){}}};
$('vc').value=T.get('vc','Puck');
$('tg').onclick=()=>{const s=$('set');s.style.display=s.style.display==='block'?'none':'block'};
$('sv').onclick=()=>{T.set('vc',$('vc').value.trim()||'Puck');$('set').style.display='none'};
let SPEAK=T.get('spk','1')==='1';const upd=()=>$('spk').textContent='🔊 Đọc cảnh báo: '+(SPEAK?'bật':'tắt');upd();
$('spk').onclick=()=>{SPEAK=!SPEAK;T.set('spk',SPEAK?'1':'0');upd()};
function say(t){if(!SPEAK||!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance(t);u.lang='vi-VN';const v=speechSynthesis.getVoices().find(v=>/vi/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}
const f2=v=>(+v).toFixed(2);
let FEED=null,LOG='',first=true;

function levels(f){const L=[];const nm={ma50:'MA50',ma100:'MA100',ma200:'MA200',bbu:'BB trên',bbm:'BB giữa',bbl:'BB dưới'};
 for(const tf in f.tf)for(const k in nm){const v=+f.tf[tf][k];if(v>0)L.push({n:nm[k]+' '+tf,v})}return L}
function describe(f){const p=(+f.bid+ +f.ask)/2,L=levels(f);
 const up=L.filter(x=>x.v>p).sort((a,b)=>a.v-b.v).slice(0,4),dn=L.filter(x=>x.v<=p).sort((a,b)=>b.v-a.v).slice(0,4);
 return{p,up,dn}}
function render(){const f=FEED;if(!f)return;const d=describe(f);
 $('px').textContent=f2(d.p);$('meta').textContent=f.sym+' · '+f.vn+' (giờ VN) · Balance '+(+f.bal).toLocaleString('vi-VN')+' · Equity '+(+f.eq).toLocaleString('vi-VN');
 $('near').innerHTML=d.up.slice().reverse().map(x=>`<div class="lv up"><span>▲ ${x.n}</span><span>${f2(x.v)} (+${f2(x.v-d.p)})</span></div>`).join('')+
  `<div class="lv"><b>Giá</b><b>${f2(d.p)}</b></div>`+d.dn.map(x=>`<div class="lv dn"><span>▼ ${x.n}</span><span>${f2(x.v)} (−${f2(d.p-x.v)})</span></div>`).join('');
 $('pos').innerHTML=f.pos.length?f.pos.map(x=>`<div class="lv"><span>${x.type} ${x.vol} @ ${x.op} · SL ${+x.sl?x.sl:'<b class="dn">CHƯA CÓ</b>'} · TP ${+x.tp?x.tp:'—'}</span><span class="${x.pnl>=0?'up':'dn'}">${x.pnl>=0?'+':''}${x.pnl}$</span></div>`).join(''):'Không có lệnh';
 let h='<tr><th></th><th>MA50</th><th>MA100</th><th>MA200</th><th>BB trên</th><th>BB giữa</th><th>BB dưới</th></tr>';
 for(const tf in f.tf){const r=f.tf[tf];h+=`<tr><td><b>${tf}</b></td><td>${f2(r.ma50)}</td><td>${f2(r.ma100)}</td><td>${f2(r.ma200)}</td><td>${f2(r.bbu)}</td><td>${f2(r.bbm)}</td><td>${f2(r.bbl)}</td></tr>`}
 $('tb').innerHTML=h}
function stateText(){const f=FEED;if(!f)return'(chưa có số liệu MT5)';const d=describe(f);
 let s=`Giờ VN ${f.vn}. ${f.sym} giá ${f2(d.p)}. Balance ${f.bal}, equity ${f.eq}.\nCản trên: ${d.up.map(x=>x.n+' '+f2(x.v)).join('; ')}.\nCản dưới: ${d.dn.map(x=>x.n+' '+f2(x.v)).join('; ')}.\n`;
 for(const tf in f.tf){const r=f.tf[tf];s+=`${tf}: MA50 ${f2(r.ma50)}, MA100 ${f2(r.ma100)}, MA200 ${f2(r.ma200)}, BB ${f2(r.bbl)}/${f2(r.bbm)}/${f2(r.bbu)}, nến trước mở ${f2(r.po)} đóng ${f2(r.pc)}, nến hiện tại mở ${f2(r.o)}.\n`}
 s+='Lệnh đang mở: '+(f.pos.length?f.pos.map(x=>`${x.type} ${x.vol} @${x.op} SL ${x.sl} TP ${x.tp} lời/lỗ ${x.pnl}$`).join('; '):'không có');return s}

async function poll(){const br=A('br'),tk=A('tk');if(!br){$('meta').textContent='Chưa có cầu nối — anh mở An, vào Cài đặt điền cầu nối trước.';return}
 try{const j=await (await fetch(br+'?p=feed&t='+encodeURIComponent(tk))).json();
  if(j.error){$('meta').textContent='Cầu nối báo: '+j.error;return}
  if(j.feed){FEED=j.feed;render()}
  const lg=j.log||'';if(lg!==LOG){const fresh=first?'':lg.slice(LOG.length>0&&lg.startsWith(LOG)?LOG.length:Math.max(0,lg.length-400));LOG=lg;$('log').textContent=lg.split('\n').reverse().join('\n');
   if(fresh.trim()&&!fresh.includes('(nói chuyện)')){const msg=fresh.trim().split('\n').pop().replace(/^\[[^\]]*\]\s*/,'');$('alert').style.display='block';$('alert').textContent=msg;navigator.vibrate&&navigator.vibrate([400,200,400]);
    if(live&&ws.readyState===1)ws.send(JSON.stringify({clientContent:{turns:[{role:'user',parts:[{text:'(Cảnh báo kỷ luật vừa xảy ra: '+msg+' — nói với anh ngắn gọn ngay.)'}]}],turnComplete:true}}));else say(msg)}}
  first=false}catch(e){$('meta').textContent='Mất kết nối cầu nối, đang thử lại…'}}
poll();setInterval(poll,5000);

function sys(){return `Em là Tô Tô — bạn đánh lệnh vàng (XAUUSD) ngồi cạnh anh Trần. Xưng "em", gọi "anh". Nói tiếng Việt, cực ngắn gọn (1–2 câu), như bạn trader thật đang nhìn cùng chart.
PHƯƠNG PHÁP CỦA ANH (bám đúng, không dạy phương pháp khác): SMA 50/100/200 và Bollinger 20 trên M5, M15, H1, H4, D1. Chạm MA là hay hồi; cản khung lớn khó phá; phá phải chờ nến sau của chính khung đó xác nhận; nến có thể phóng qua chút rồi rút râu. Anh ăn 5–10 giá, TP ở cản MA/BB gần nhất, sắp hết nến M15/H1 thì chốt, dời SL về hòa vốn. Rải lệnh chỉ khi giữa entry và SL tổng có cản (cản sát <4 giá thì gộp đặt giữa).
LUẬT KỶ LUẬT (nhắc thẳng, không mắng): lot tối đa 0.1 (anh từng mất hơn 3 nghìn vì tăng lot nhồi lệnh); lệnh nào cũng có SL; không dời SL xa ra; thua 2 lệnh cùng hướng thì dừng hướng đó chờ nến H1 sau; tránh 7h sáng, 21–22h, 1–3h sáng và giờ tin tối.
Mục tiêu: FTMO 1-Step 100k, cần +10%, giới hạn lỗ ngày 3%, lỗ tổng 10%.
Em chỉ góp ý, quyết định là của anh. Không bịa số: chỉ dùng số liệu MT5 được gửi. Khi anh chào tạm biệt thì chào lại 1 câu.
SỐ LIỆU MT5 HIỆN TẠI:
${stateText()}`}

let ws,ac,po,src,proc,stream,playAt=0,live=false,curU=null,curA=null,tick=null,BYE=false,tr=[];
function add(c,t){const d=document.createElement('div');d.className='m '+c;d.textContent=t;$('chat').prepend(d);return d}
async function start(){const key=A('k');if(!key){alert('Anh mở An, vào Cài đặt dán khóa Gemini trước nhé.');return}
 try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,channelCount:1}})}catch(e){alert('Chưa cho phép micro');return}
 ac=new AudioContext({sampleRate:16000});po=new AudioContext({sampleRate:24000});playAt=0;$('talk').textContent='Đang kết nối…';
 ws=new WebSocket('wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key='+encodeURIComponent(key));
 ws.onopen=()=>ws.send(JSON.stringify({setup:{model:'models/'+(A('md')||'gemini-live-2.5-flash-preview'),generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:T.get('vc','Puck')}}}},systemInstruction:{parts:[{text:sys()}]},inputAudioTranscription:{},outputAudioTranscription:{}}}));
 ws.onmessage=async ev=>{const t=typeof ev.data==='string'?ev.data:await ev.data.text();let m;try{m=JSON.parse(t)}catch(e){return}
  if(m.setupComplete){live=true;$('talk').textContent='Kết thúc';mic();
   ws.send(JSON.stringify({clientContent:{turns:[{role:'user',parts:[{text:'(Anh vừa mở Tô Tô. Chào ngắn và nói 1 câu về vị trí giá so với cản gần nhất.)'}]}],turnComplete:true}}));
   tick=setInterval(()=>{if(live&&ws.readyState===1)ws.send(JSON.stringify({clientContent:{turns:[{role:'user',parts:[{text:'(Cập nhật số liệu, KHÔNG cần trả lời:\n'+stateText()+')'}]}],turnComplete:false}}))},30000);return}
  const sc=m.serverContent;if(!sc)return;
  if(sc.inputTranscription?.text){if(!curU){curU=add('u','');tr.push(['Anh',''])}curU.textContent+=sc.inputTranscription.text;tr[tr.length-1][1]+=sc.inputTranscription.text;curA=null;if(/t[aạ]m bi[eệ]t|\bbye\b|th[oô]i nh[eé]|anh [dđ]i [dđ][aâ]y/i.test(curU.textContent))BYE=true}
  if(sc.outputTranscription?.text){if(!curA){curA=add('a','');tr.push(['Tô Tô',''])}curA.textContent+=sc.outputTranscription.text;tr[tr.length-1][1]+=sc.outputTranscription.text;curU=null}
  for(const p of sc.modelTurn?.parts||[]){if(p.inlineData?.data)play(p.inlineData.data)}
  if(sc.interrupted){playAt=0;try{po.close()}catch(e){}po=new AudioContext({sampleRate:24000})}
  if(sc.turnComplete){curA=null;curU=null;if(BYE){BYE=false;setTimeout(()=>{if(live)stop()},Math.max(0,(playAt-po.currentTime)*1000)+700)}}};
 ws.onclose=e=>{if(live)stop();else{$('talk').textContent='Nói với Tô Tô';alert('Không kết nối được: '+(e.reason||e.code))}};}
function mic(){src=ac.createMediaStreamSource(stream);proc=ac.createScriptProcessor(2048,1,1);
 proc.onaudioprocess=e=>{if(!live||ws.readyState!==1)return;const f=e.inputBuffer.getChannelData(0),b=new Int16Array(f.length);
  for(let i=0;i<f.length;i++){const s=Math.max(-1,Math.min(1,f[i]));b[i]=s<0?s*32768:s*32767}
  let bin='';const u=new Uint8Array(b.buffer);for(let i=0;i<u.length;i++)bin+=String.fromCharCode(u[i]);
  ws.send(JSON.stringify({realtimeInput:{audio:{data:btoa(bin),mimeType:'audio/pcm;rate=16000'}}}))};src.connect(proc);proc.connect(ac.destination)}
function play(b64){const s=atob(b64),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);
 const p=new Int16Array(u.buffer),f=new Float32Array(p.length);for(let i=0;i<p.length;i++)f[i]=p[i]/32768;
 const buf=po.createBuffer(1,f.length,24000);buf.copyToChannel(f,0);const n=po.createBufferSource();n.buffer=buf;n.connect(po.destination);
 const t=Math.max(po.currentTime,playAt);n.start(t);playAt=t+buf.duration}
function stop(){live=false;clearInterval(tick);$('talk').textContent='Nói với Tô Tô';
 try{proc&&proc.disconnect();src&&src.disconnect();stream&&stream.getTracks().forEach(t=>t.stop());ws&&ws.readyState===1&&ws.close();ac&&ac.close()}catch(e){}
 const text=tr.filter(x=>x[1].trim()).map(x=>x[0]+': '+x[1].trim()).join('\n');tr=[];
 if(text.length>40&&A('br'))fetch(A('br'),{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({t:A('tk'),a:'toto',text:'['+new Date().toLocaleString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh'})+'] (nói chuyện)\n'+text.slice(-3000)})}).catch(()=>{})}
$('talk').onclick=()=>live?stop():start();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
