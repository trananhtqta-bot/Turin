<style>
[hidden]{display:none!important}
/* Game một màn hình; thẻ thông báo kiểu sơn mài đỏ – vàng hội làng */
:root{

  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--troi);font-family:var(--font);color:var(--muc);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;width:100%;overflow:hidden;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:6px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.chip{background:rgba(38,21,12,.72);color:var(--vang);border-radius:999px;padding:2px 11px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip b{color:#fff;font-weight:800}
#toast{position:absolute;left:50%;top:calc(46px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(340px,calc(100% - 32px));
  background:rgba(38,21,12,.82);color:#fff;border-radius:12px;padding:6px 12px;font-size:15px;line-height:1.3;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
#toast b{color:var(--vang)}
#quynh{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:min(260px,70%);
  background:#fffbea;border:2px solid var(--muc);border-radius:14px 14px 14px 2px;padding:5px 10px;font-size:14px;line-height:1.3;pointer-events:none;opacity:0;transition:opacity .25s}
#quynh.on{opacity:1}
#quynh b{display:block;font-size:12px;color:var(--do)}
#items{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:flex-start;
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.it{pointer-events:auto;font-family:var(--font);font-size:14px;font-weight:800;width:auto;padding:6px 12px;border-radius:12px;border:2px solid var(--vang);background:rgba(91,22,18,.9);color:var(--vang);box-shadow:none}
.it.passive{pointer-events:none;opacity:.9;background:rgba(38,21,12,.75);color:#fff;border-color:rgba(255,255,255,.5)}
.it.used{opacity:.35}
.layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(20,10,5,.4);overflow-y:auto;box-sizing:border-box}
.card{width:100%;max-width:380px;max-height:100%;overflow-y:auto;background:linear-gradient(160deg,var(--son2),var(--son));color:var(--kem);border:3px solid var(--vang);border-radius:18px;padding:18px 18px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35);text-align:left;box-sizing:border-box;margin:auto}
.card h1{font-size:38px;line-height:1;margin:0 0 2px;color:var(--vang);font-weight:800;text-wrap:balance}
.card h2{font-size:24px;line-height:1.15;margin:0 0 6px;color:var(--vang);font-weight:800;text-wrap:balance}
.card h3{font-size:17px;margin:12px 0 6px;color:var(--vang);font-weight:800}
.card p{margin:0 0 10px;font-size:16px;line-height:1.4}
.sub{font-size:13px;opacity:.85;text-transform:uppercase;letter-spacing:1.4px;margin-bottom:6px;display:block}
.small{font-size:14px;opacity:.9}
button{font-family:var(--font);font-size:19px;font-weight:800;width:100%;padding:9px 14px;border:0;border-radius:12px;background:var(--vang);color:var(--son);cursor:pointer;box-shadow:0 4px 0 #b88a1a}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #b88a1a}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
button.ghost{background:transparent;color:var(--vang);box-shadow:none;border:2px solid var(--vang);font-size:16px}
button:disabled{opacity:.4;cursor:default}
.stack{display:grid;gap:8px}
.row{display:flex;gap:8px}
.stat{font-variant-numeric:tabular-nums;color:var(--vang);font-weight:700}
.goals{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:4px;font-size:15px}
.goals li{display:flex;gap:8px;align-items:center}
.star{color:var(--vang);font-size:18px;line-height:1}
.star.off{color:rgba(247,231,196,.3)}
.bigstars{font-size:40px;letter-spacing:6px;text-align:center;margin:2px 0 6px;line-height:1}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;margin:4px 0}
.opt input{width:22px;height:22px;accent-color:var(--vang);flex:none}
.items{display:grid;gap:8px;margin-bottom:12px}
.irow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:rgba(0,0,0,.18);border-radius:12px;padding:8px 10px}
.irow .nm{font-weight:800;color:#fff;font-size:15px;line-height:1.2}
.irow .ds{font-size:13px;opacity:.85;line-height:1.25}
.irow button{width:auto;font-size:14px;padding:5px 9px;box-shadow:0 3px 0 #b88a1a}
.irow button.sel{background:#fff;color:var(--son)}
.irow.lock{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.lv{font-size:17px;padding:6px 0 4px;border-radius:10px;line-height:1.05;box-shadow:0 3px 0 #b88a1a}
.lv small{display:block;font-size:11px;letter-spacing:1px;color:var(--son2)}
.gifts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.gift{background:rgba(0,0,0,.2);border-radius:10px;padding:6px;font-size:12.5px;line-height:1.2;min-height:44px}
.gift b{display:block;color:var(--vang);font-size:11px}
.gift.no{opacity:.4}
.say{background:rgba(0,0,0,.2);border-left:4px solid var(--vang);border-radius:8px;padding:8px 10px;margin:0 0 10px;font-size:15px;line-height:1.35}
.say i{display:block;font-size:13px;opacity:.85;margin-top:2px}
.but{background:#fff3c4;color:var(--muc);border-radius:12px;padding:8px 10px;margin:0 0 10px;font-size:15px;line-height:1.35}
.but b{color:var(--son2)}
.newit{color:#fff;background:rgba(245,197,66,.2);border-radius:10px;padding:6px 10px;margin:0 0 10px;font-weight:700}
</style>
</head>

  <div class="layer" id="map" hidden>

      <h2 id="mapT"></h2>
      <div id="mapBody"></div>

  <div class="layer" id="giftsL" hidden>

      <p class="small" id="gCount"></p>

  </div>

  <div class="layer" id="story" hidden>
    <div class="card">
      <span class="sub" id="sSub"></span>
      <h2 id="sTitle"></h2>
      <p id="sText"></p>
      <button id="bStory"></button>
    </div>
  </div>

  <div class="layer" id="pre" hidden>
    <div class="card">
      <span class="sub" id="pSub"></span>
      <h2 id="pTitle"></h2>
      <p class="small" id="pPrize"></p>
      <ul class="goals" id="pGoals"></ul>
      <h3 id="pBringT"></h3>
      <div class="items" id="pItems"></div>
      <div class="row"><button class="ghost" id="bPreBack" style="flex:1"></button><button id="bGo" style="flex:2"></button></div>
    </div>
  </div>

  <div class="layer" id="lose" hidden>
    <div class="card">
      <span class="sub" id="lSub"></span>
      <h2 id="lMsg"></h2>
      <p id="lH"></p>
      <div class="say" id="lSay"></div>
      <div class="but" id="lBut" hidden></div>
      <div class="row"><button class="ghost" id="bLMenu" style="flex:1"></button><button id="bRetry" style="flex:2"></button></div>
    </div>
  </div>

  <div class="layer" id="win" hidden>
    <div class="card">
      <span class="sub" id="wSub"></span>
      <div class="bigstars" id="wStars"></div>
      <h2 id="wPrize"></h2>
      <ul class="goals" id="wGoals"></ul>
      <p class="stat" id="wCoins"></p>
      <div class="newit" id="wNew" hidden></div>
      <div class="say" id="wStory" hidden></div>
      <div class="row"><button class="ghost" id="bWMenu" style="flex:1"></button><button id="bNext" style="flex:2"></button></div>
    </div>
  </div>
</div>

// Cấp 1–6 giữ như bản thử; từ cấp 7 tăng chậm hơn (hệ số 0,45)
// Cân độ khó (giai đoạn 4): mỗi chặng bắt đầu dễ hơn cuối chặng trước một chút, rồi tăng dần
const TUNE=window.__TUNE||{base:6.5,step:.3,local:.22,catchX:1.5,catchGap:5,adj:{4:-1.2,5:-.6,8:-1.5,9:-.5,10:-3.3}};
function flags(l){const k=Math.min(10,Math.ceil(l/10));return{phao:k===2||k===10,birds:k===3||k===10,song:k===4||k===10,trau:k===5||k===10,dark:k===6,fog:k===7,rain:k===8,two:k===9||(k===10&&l>=95)};}
function P(l){
  const k=Math.min(10,Math.ceil(l/10)),loc=(l-1)%10;
  const e=k===1?(l<=6?l:6+(l-6)*.45):TUNE.base+(k-2)*TUNE.step+loc*TUNE.local+(TUNE.adj[k]||0);
  const poleH=Math.round(Math.min(40,8+2*(e-1)));
  return{e,poleH,gc:Math.min(.8,.3+.07*e),
    ch:l<=3?.22+.05*(l-1):Math.min(1.15,.34+.04*(e-1)),
    warn:Math.max(.75,1.35-.045*e),bRate:Math.min(2.4,(1+.07*e)*(flags(l).birds?.8:1)),wRate:Math.min(2.2,1+.04*e),dbl:e>=6,
    banana:l>=2,wind:l>=3,...flags(l),
    tgt:Math.round(poleH/1.25+3)};
}
const changOf=l=>Math.min(10,Math.ceil(l/10));

let AC=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function beep(f,d,type='square',vol=.05,slide=0){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);}
function boomSnd(){for(let i=0;i<7;i++)setTimeout(()=>beep(R(90,180),.12,'sawtooth',.07,-50),i*90+R(0,40));}

const VSTYLE={loa:[1,1],quynh:[1.12,1.35],but:[.85,.6],ly:[1.15,1.6],crowd:[1.1,1.2],say:[.95,1]};
function speak(text,style='say',urgent=false){
  if(!S.voice||!SS)return;const v=voiceFor(S.lang==='en'?'en':'vi');if(!v)return;
  try{if(urgent)SS.cancel();const u=new SpeechSynthesisUtterance(text.replace(/[“”"]/g,''));u.voice=v;u.lang=v.lang;const st=VSTYLE[style]||VSTYLE.say;u.rate=st[0];u.pitch=st[1];u.volume=1;SS.speak(u);}catch(e){}
}

/* ================= NHẠC HỘI (trống + sáo, thang ngũ cung) ================= */
let NOISE=null,MUS={on:false,next:0,step:0,timer:0,mel:[],bpm:112,k:0};
function noiseBuf(){if(!AC)return null;if(NOISE)return NOISE;const n=AC.sampleRate*.5,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;NOISE=b;return b;}
function drum(t,f,vol,dur){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(f*1.6,t);o.frequency.exponentialRampToValueAtTime(f,t+.05);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur);}
function click(t,vol,freq=2500,dur=.04){const b=noiseBuf();if(!b)return;const src=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();src.buffer=b;f.type='bandpass';f.frequency.value=freq;f.Q.value=3;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);src.connect(f).connect(g).connect(AC.destination);src.start(t,Math.random()*.3);src.stop(t+dur);}
function flute(t,f,dur,vol){const o=AC.createOscillator(),l=AC.createOscillator(),lg=AC.createGain(),g=AC.createGain();o.type='triangle';o.frequency.setValueAtTime(f,t);l.frequency.value=5.5;lg.gain.value=f*.012;l.connect(lg).connect(o.frequency);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.04);g.gain.setValueAtTime(vol,t+dur*.7);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);l.start(t);o.stop(t+dur+.02);l.stop(t+dur+.02);}
function splash(){if(!AC)return;const b=noiseBuf();if(!b)return;const t=AC.currentTime,src=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();src.buffer=b;f.type='lowpass';f.frequency.setValueAtTime(2200,t);f.frequency.exponentialRampToValueAtTime(300,t+.5);g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.0001,t+.6);src.connect(f).connect(g).connect(AC.destination);src.start(t);src.stop(t+.6);}
// thang "hơi Bắc": đô rê pha son la
const PENTA=[0,2,5,7,9];
function makeMelody(k){const r=rng(k*31+7);const m=[];let idx=5;for(let i=0;i<32;i++){if(i%4===3&&r()<.5){m.push(null);continue;}idx=Math.max(0,Math.min(10,idx+Math.round((r()-.5)*3)));if(i%8===7)idx=5;m.push(idx);}return m;}
function musicStart(){
  if(!AC||!S.music){musicStop();return;}
  const k=changOf(L)-1;
  if(MUS.on&&MUS.k===k)return;
  MUS.on=true;MUS.k=k;MUS.mel=makeMelody(k);MUS.bpm=[112,124,96,108,116,84,100,120,104,128][k];MUS.step=0;MUS.next=AC.currentTime+.1;
  clearInterval(MUS.timer);MUS.timer=setInterval(musicTick,50);
}
function musicStop(){MUS.on=false;clearInterval(MUS.timer);}
function musicTick(){
  if(!MUS.on||!AC)return;
  const spb=60/MUS.bpm/2,soft=(MUS.k===5||MUS.k===7)?.55:1,base=[293.66,261.63,246.94,293.66,329.63,220,261.63,246.94,293.66,329.63][MUS.k];
  while(MUS.next<AC.currentTime+.2){
    const t=MUS.next,st=MUS.step%16;
    if(st%4===0)drum(t,st===0?62:70,.22*soft,.35);
    if(st===10)drum(t,70,.12*soft,.25);
    if(st%2===1)click(t,.07*soft,st%4===3?3200:2200,.035);
    if(MUS.k===1&&st===14)click(t,.05,5000,.08);
    const n=MUS.mel[MUS.step%MUS.mel.length];
    if(n!==null&&MUS.step%2===0){const oct=Math.floor(n/5),deg=PENTA[n%5];flute(t,base*Math.pow(2,oct-1+deg/12)*2,spb*1.8,.045*soft);}
    MUS.next+=spb;MUS.step++;
  }
}

let mode='menu',L=1,PR=P(1),poleH=8,grease=[],knots=[],time=0;
let c,ch,bananas,birds,wind,phao,nextB,nextW,nextP,nextBird,texts,shake,cam,confetti,bits,fall,hits,troT,tao,dog,taunt,quynhSaid,ch2=null,song={s:'none',t:0},trau={s:'none',t:0,side:1},nextS=1e9,nextT=1e9,cheT=0,flash=0,nextFlash=1e9,lanterns=[],fogs=[],run={},bringSel=new Set();
function setup(l){
  L=l;PR=P(l);poleH=PR.poleH;const r=rng(l*7919+13);
  grease=[];let y=1.4;
  while(y<poleH-1.4){if(r()<PR.gc){const len=Math.min(.5+r()*(.5+.09*PR.e),2.6);const e=Math.min(y+len,poleH-1.1);grease.push([y,e]);y=e+.7+r()*1.6;}else y+=.8+r()*1.2;}
  knots=[];for(let k=3.6+r();k<poleH-1.2;k+=(PR.trau?2.4:4)+r()*1.5){let kk=k;for(const g of grease){if(kk>g[0]-.2&&kk<g[1]+.2)kk=g[1]+.35;}if(kk<poleH-1.2)knots.push(kk);}
  c={y:0,v:0,stun:0,anim:0,slip:0};
  ch={y:-1.7,delay:2.2+(l<=3?(4-l)*.8:0)};
  ch2=PR.two?{y:-3.6,delay:4.5}:null;
  song={s:'none',t:0};trau={s:'none',t:0,side:1};nextS=PR.song?4+r()*2:1e9;nextT=PR.trau?5+r()*2:1e9;cheT=0;flash=0;nextFlash=PR.rain?R(4,8):1e9;
  lanterns=[];if(PR.dark)for(let h=1.2;h<poleH;h+=2.3+r()*.9)lanterns.push({h,side:r()<.5?-1:1});
  fogs=[];if(PR.fog)for(let i=0;i<Math.ceil(poleH/4.5);i++)fogs.push({y:1.5+i*4.5+r()*1.5,h:1.5+r()*1.3,ph:r()*6});
  bananas=[];birds=[];wind={s:'none',t:0,dir:1};phao={s:'none',t:0,h:0};
  nextB=PR.banana?2.2+r()*1.5:1e9;nextW=PR.wind?4+r()*2:1e9;nextP=PR.phao?3+r()*2.5:1e9;nextBird=PR.birds?3.5+r()*2:1e9;
  texts=[];shake=0;cam=0;confetti=[];bits=[];fall=null;time=0;hits=0;troT=0;taunt=0;quynhSaid=0;
  tao=changOf(l)===2?{t:R(4,8),p:-1,kind:'tao'}:(changOf(l)===10?{t:R(5,9),p:-1,kind:'giong'}:null);
  dog={x:-1,dir:1,bark:R(3,6)};
  hud();
}
function hud(){
  $('hLvT').textContent=tr('lv');$('hLv').textContent=L+(REAL?' · '+tr('testTag'):'');
  $('hT').textContent=poleH;$('hC').textContent=S.coins;$('hCT').textContent=tr('coins');
}
const busy=()=>wind.s!=='none'||phao.s!=='none'||song.s!=='none'||trau.s!=='none';
const inGrease=y=>grease.some(g=>y>=g[0]&&y<=g[1]);
const slippery=y=>troT<=0&&inGrease(y);
const atKnot=y=>knots.some(k=>Math.abs(y-k)<.16);
function say(t,y,col='#fff'){if(texts.some(o=>o.t===t&&o.a>.6))return;texts.push({t,y,a:1.2,col});}
let toastT=0;
function toast(html,ms=2600){const el=$('toast');el.innerHTML=html;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),ms);}
let qT=0;
function quynh(){const q=pick(QUYNH)[S.lang==='en'?1:0];speak(q,'quynh');$('qTxt').textContent=q;const el=$('quynh');el.classList.add('on');clearTimeout(qT);qT=setTimeout(()=>el.classList.remove('on'),2800);}
function hideBubbles(){$('quynh').classList.remove('on');$('toast').classList.remove('on');}

/* ================= ĐỒ HỖ TRỢ ================= */
function useItem(id){run[id]=false;S.inv[id]=Math.max(0,S.inv[id]-1);save();drawItems();}
const ACTIVE={
  tro:()=>{troT=5;say(tr('ash'),c.y+1.2,'#fff1a8');},
  che:()=>{cheT=3;say(tr('cheUse'),c.y+1.2,'#fff1a8');},
  phao:()=>{ch.y-=2;ch.delay=Math.max(ch.delay,.6);if(ch2)ch2.y-=2;say(tr('phaoUse'),Math.max(ch.y+1.4,c.y-.6),'#ffd2d2');boomSnd();shake=.3;
    const py=SY(ch.y+1);for(let i=0;i<30;i++)bits.push({x:W/2,y:py,vx:R(-200,200),vy:R(-250,0),r:R(0,6),a:1});}};
function drawItems(){
  const box=$('items');box.innerHTML='';
  if(mode!=='play')return;
  ITEMS.forEach(it=>{
    if(!run['had_'+it.id])return;
    const b=document.createElement('button');b.className='it';
    if(ACTIVE[it.id]){
      const tl=it.id==='tro'?troT:it.id==='che'?cheT:0;
      b.textContent=itName(it.id)+(tl>0?` ${Math.ceil(tl)}s`:'');
      if(!run[it.id]&&tl<=0)b.classList.add('used');
      b.onpointerdown=e=>{e.stopPropagation();e.preventDefault();if(run[it.id]&&mode==='play'){useItem(it.id);ACTIVE[it.id]();beep(700,.15,'triangle',.05,300);drawItems();}};
    }else{
      b.classList.add('passive');b.textContent=itName(it.id)+(run[it.id]?' · '+tr('ready'):'');
      if(!run[it.id])b.classList.add('used');
    }
    box.appendChild(b);
  });
}

/* ================= ĐIỀU KHIỂN ================= */
function tap(){
  if(mode!=='play'||c.stun>0)return;
  if(wind.s==='gust'){
    if(run.day){useItem('day');say(tr('rope'),c.y+1.2,'#d8ffd0');beep(500,.12,'triangle',.05,200);wind.t=Math.min(wind.t,.15);return;}
    c.v=-2.8;c.slip=.45;say(tr('slip'),c.y+1.1,'#ffd2d2');beep(220,.18,'sawtooth',.05,-120);shake=.25;return;
  }
  const g=slippery(c.y+.3);
  let gain=g?(PR.rain?1.4:1.6):(PR.rain?2.12:2.2);
  if(song.s==='on'&&Math.abs(Math.sin(time*4.2))>.55){gain=.5;say(tr('songWeak'),c.y+1.1,'#d8f0ff');}
  if(cheT>0)gain*=1.8;
  c.v=Math.max(c.v,-.5)+gain;const cap=cheT>0?4.6:3.3;if(c.v>cap)c.v=cap;
  c.anim^=1;
  beep(g?300:420+Math.random()*60,.05,'square',.03,g?-80:120);
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();tap();});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();tap();}});

function hitPlayer(kind){
  if(run.non){useItem('non');say(tr('hat'),c.y+1.2,'#d8ffd0');beep(800,.1,'triangle',.05);return;}
  c.y=Math.max(0,c.y-(kind==='banana'?1:.6));c.v=-1.2;c.stun=kind==='banana'?.45:.4;shake=.35;hits++;
  say(tr(kind==='banana'?'bhit':'birdhit'),c.y+1.2,'#fff1a8');beep(150,.25,'sawtooth',.07,-80);
  if(hits===1&&Math.random()<.6)quynh();
}

/* ================= MÀN HÌNH ================= */

function show(id){LAYERS.forEach(k=>$(k).hidden=k!==id);$('hud').style.visibility=(id==='menu'||id==='langpick'||id==='map'||id==='giftsL')?'hidden':'visible';}
function starStr(n){return'<span class="star">'+'★'.repeat(n)+'</span><span class="star off">'+'★'.repeat(3-n)+'</span>';}

function openMenu(){
  mode='menu';hush();musicStop();hideBubbles();drawItems();
  document.documentElement.lang=S.lang||'vi';
  $('mTitle').textContent=tr('title');$('mSub').textContent=S.lang==='en'?'Leo Cột Mỡ · '+tr('sub'):tr('sub');
  $('mHow').textContent=tr('how');
  $('bCont').textContent=tr('cont',Math.min(S.unl,MAXL));
  $('bMap').textContent=tr('map');$('bGifts').textContent=tr('gifts');$('bStoryAgain').textContent=tr('storyAgain');$('bLang').textContent=tr('lang');$('bVoice').textContent=S.voice?tr('voiceOn'):tr('voiceOff');$('bMusic').textContent=S.music!==false?tr('musicOn'):tr('musicOff');
  const nv=$('mNoVoice');nv.hidden=!(S.voice&&SS&&VOICES.length&&!hasVoice());nv.textContent=tr('noVoice');
  $('mTest').textContent=tr('test');$('test').checked=!!REAL;
  setup(Math.min(S.unl,MAXL));
  show('menu');
}
function openMap(){
  $('mapT').textContent=tr('map');$('bMapBack').textContent=tr('back');
  const body=$('mapBody');body.innerHTML='';
  for(let k=0;k<10;k++){
    const h=document.createElement('h3');h.textContent=tr('chang')[k];body.appendChild(h);
    const g=document.createElement('div');g.className='grid';
    for(let l=k*10+1;l<=k*10+10;l++){
      const b=document.createElement('button');b.className='lv';const st=S.stars[l]||0;
      b.innerHTML=l+'<small>'+(st?'★'.repeat(st):'&nbsp;')+'</small>';
      b.disabled=l>S.unl;b.onclick=()=>{audio();startLevel(l);};g.appendChild(b);
    }
    body.appendChild(g);
  }
  const p=document.createElement('p');p.className='small';p.textContent=S.unl>MAXL?tr('done'):'';body.appendChild(p);
  show('map');
}
function openGifts(){
  $('gT').textContent=tr('gifts');$('bGBack').textContent=tr('back');
  let n=0;const g=$('gGrid');g.innerHTML='';
  for(let l=1;l<=MAXL;l++){const got=!!S.stars[l];if(got)n++;
    const d=document.createElement('div');d.className='gift'+(got?'':' no');
    d.innerHTML='<b>'+tr('lv')+' '+l+'</b>'+(got?prizeOf(l):'?');g.appendChild(d);}
  $('gCount').textContent=tr('giftCount',n);
  show('giftsL');
}
function openStory(k,then){
  $('sSub').textContent=tr('chang')[k];$('sTitle').textContent=tr('loaT');
  $('sTitle').textContent=tr('chang')[k].split('· ')[1]||tr('chang')[k];
  $('sText').textContent=tr('story')[k];$('bStory').textContent=tr('storyBtn');
  $('bStory').onclick=()=>{hush();S.seen[k]=1;save();then();};
  setTimeout(()=>speak(tr('story')[k],'say',true),300);
  show('story');
}
function startLevel(l){
  const k=changOf(l)-1;
  if(l%10===1&&!S.seen[k])openStory(k,()=>openPre(l));else openPre(l);
}
function openPre(l){
  setup(l);mode='pre';
  $('pSub').textContent=tr('chang')[changOf(l)-1];
  $('pTitle').textContent=tr('lv')+' '+l+' · '+PR.poleH+' m';
  $('pPrize').textContent=tr('prize',prizeOf(l));
  const best=S.stars[l]||0;
  $('pGoals').innerHTML=[tr('g1'),tr('g2',PR.tgt),tr('g3')].map((g,i)=>`<li><span class="star${best>i?'':' off'}">★</span>${g}</li>`).join('');
  $('pBringT').textContent=tr('bring')+' · '+S.coins+' '+tr('coins');
  [...bringSel].forEach(id=>{if(!(S.inv[id]>0))bringSel.delete(id);});
  const box=$('pItems');box.innerHTML='';
  ITEMS.forEach(it=>{
    const row=document.createElement('div');row.className='irow';const [nm,ds]=tr('it')[it.id];
    if(!itemOpen(it)){row.classList.add('lock');row.innerHTML=`<div><div class="nm">${nm}</div><div class="ds">${tr('lockAfter',it.after)}</div></div>`;box.appendChild(row);return;}
    row.innerHTML=`<div><div class="nm">${nm} · ${tr('have',S.inv[it.id])}</div><div class="ds">${ds}</div></div>`;
    const bb=document.createElement('button');bb.textContent=tr('buy',it.price);bb.disabled=S.coins<it.price;
    bb.onclick=()=>{if(S.coins>=it.price){S.coins-=it.price;S.inv[it.id]++;save();beep(880,.08);openPre(l);}};
    const bt=document.createElement('button');const sel=bringSel.has(it.id);bt.textContent=sel?tr('taken'):tr('take');if(sel)bt.classList.add('sel');
    bt.disabled=!(S.inv[it.id]>0)||(!sel&&bringSel.size>=2);
    bt.onclick=()=>{if(bringSel.has(it.id))bringSel.delete(it.id);else if(bringSel.size<2)bringSel.add(it.id);openPre(l);};
    row.appendChild(bb);row.appendChild(bt);box.appendChild(row);
  });
  $('bPreBack').textContent=tr('back');$('bGo').textContent=tr('go');
  show('pre');
}
function go(){
  audio();setup(L);
  run={};ITEMS.forEach(it=>{const ok=bringSel.has(it.id)&&S.inv[it.id]>0&&itemOpen(it);run[it.id]=ok;run['had_'+it.id]=ok;});
  mode='play';show(null);drawItems();if(S.music!==false)musicStart();
  toast('<b>'+tr('loaT')+':</b> '+tr('loa')[changOf(L)-1],3000);speak(tr('loa')[changOf(L)-1],'loa',true);
}
function lose(msg){
  if(mode!=='play')return;
  if(REAL&&!window.__sim){ch.y=c.y-3.5;ch.delay=1.2;if(ch2)ch2.y=c.y-5;say(tr('escaped'),c.y+1.3,'#bde7ff');return;}
  mode='falling';fall={t:0,y:c.y,v:1.5};drawItems();
  if(S.streak.lv===L)S.streak.n++;else S.streak={lv:L,n:1};
  let gift=null;
  if(S.streak.n>=3){S.streak.n=0;const open=ITEMS.filter(itemOpen);
    if(open.length){const it=pick(open);S.inv[it.id]++;gift=itName(it.id);}else{S.coins+=15;gift=tr('coinsN',15);}}
  save();
  $('lSub').textContent=tr('chang')[changOf(L)-1]+' · '+tr('lv')+' '+L;
  $('lMsg').textContent=msg;
  $('lH').textContent=tr('climbed',c.y.toFixed(1).replace('.',S.lang==='en'?'.':','),poleH);
  const sy=pick(SAYINGS);
  $('lSay').innerHTML=S.lang==='en'?`<b>${tr('sayT')}:</b> “${sy[0]}”<i>${sy[1]}</i>`:`<b>${tr('sayT')}:</b> “${sy[0]}”`;
  const lb=$('lBut');if(gift){lb.hidden=false;lb.innerHTML=`${tr('but')}<br><b>${tr('butGot',gift)}</b>`;setTimeout(()=>speak(tr('but'),'but'),1400);}else{lb.hidden=true;setTimeout(()=>speak(sy[0],'say'),1500);}
  $('bRetry').textContent=tr('retry');$('bLMenu').textContent=tr('menu');
  beep(500,.6,'triangle',.06,-420);dog.bark=0;
}
function win(){
  mode='won';drawItems();hideBubbles();$('hH').textContent=poleH;
  const ok2=time<=PR.tgt,ok3=hits===0,st=1+(ok2?1:0)+(ok3?1:0);
  if(st>(S.stars[L]||0))S.stars[L]=st;
  const coins=5+5*st;S.coins+=coins;
  let newIt=null;
  ITEMS.forEach(it=>{if(it.after===L&&S.unl<=L){S.inv[it.id]++;newIt=itName(it.id);}});
  if(L+1>S.unl)S.unl=Math.min(MAXL+1,L+1);
  S.streak={lv:0,n:0};save();hud();
  $('wSub').textContent=tr('won',L);
  $('wStars').innerHTML=starStr(st);
  $('wPrize').textContent=tr('grab',prizeOf(L));
  $('wGoals').innerHTML=[[tr('g1'),1],[tr('g2',PR.tgt)+' ('+time.toFixed(1).replace('.',S.lang==='en'?'.':',')+'s)',ok2],[tr('g3'),ok3]].map(([g,o])=>`<li><span class="star${o?'':' off'}">★</span>${g}</li>`).join('');
  $('wCoins').textContent=tr('coinsWon',coins);
  const wn=$('wNew');if(newIt){wn.hidden=false;wn.textContent=tr('newIt',newIt);}else wn.hidden=true;
  const ws=$('wStory');if(L%10===0){ws.hidden=false;ws.textContent=tr('ends')[L/10-1];}else ws.hidden=true;
  $('bNext').textContent=L<MAXL?tr('next'):tr('menu');$('bWMenu').textContent=tr('menu');
  for(let i=0;i<90;i++)confetti.push({x:W/2,y:HH*.3,vx:R(-220,220),vy:R(-380,-80),c:['#d7261e','#f5c542','#2f6fd0','#2e9e4f','#fff'][i%5],r:R(0,6.28)});
  [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.18,'square',.05),i*110));speak(tr('hoan'),'crowd',true);
  dog.bark=0;
  setTimeout(()=>show('win'),1100);
}

$('bMusic').onclick=()=>{audio();S.music=S.music===false;if(REAL)REAL.music=S.music;save();if(!S.music)musicStop();openMenu();};

$('bGifts').onclick=openGifts;$('bGBack').onclick=openMenu;

/* ================= CẬP NHẬT ================= */
function update(dt){
  // chó Mực chạy quanh bờ ao
  dog.x+=dog.dir*dt*.35;if(dog.x>1){dog.x=1;dog.dir=-1;}if(dog.x<-1){dog.x=-1;dog.dir=1;}
  dog.bark-=dt;if(dog.bark<=0){dog.bark=R(5,9);if(mode==='play'||mode==='falling'||mode==='won'){dog.say=1;beep(320,.07,'square',.03,-60);setTimeout(()=>beep(300,.07,'square',.03,-60),120);}}
  if(dog.say>0)dog.say-=dt;
  bits.forEach(p=>{p.vy+=300*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=dt*8;p.a-=dt*.6;});bits=bits.filter(p=>p.a>0);
  if(tao&&mode==='play'){if(tao.p<0){tao.t-=dt;if(tao.t<=0){tao.p=0;const kk=tao.kind==='giong'?'giong':'tao';toast(tr(kk),2600);speak(tr(kk),'loa');}}else if(tao.p<=1)tao.p+=dt/7;}
  if(mode==='falling'){fall.t+=dt;fall.v-=9*dt;fall.y+=fall.v*dt;if(fall.y<-1.4&&!fall.splash){fall.splash=1;splash();shake=.4;{const y0=SY(0)+PPM*.5;for(let i=0;i<40;i++)bits.push({x:W/2+R(-20,20),y:y0,vx:R(-160,160),vy:R(-420,-150),r:0,a:1.1,w:1});}speak(tr('oi'),'crowd',true);}if(fall.t>1.3&&$('lose').hidden)show('lose');cam+=(Math.max(fall.y,-.6)-.6-cam)*Math.min(1,dt*4);shake=Math.max(0,shake-dt);return;}
  if(mode==='won'){confetti.forEach(p=>{p.vy+=500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=dt*6;});return;}
  if(mode!=='play'){time+=dt;return;}
  time+=dt;
  if(troT>0||cheT>0){const b1=Math.ceil(troT)+Math.ceil(cheT)*10;troT=Math.max(0,troT-dt);cheT=Math.max(0,cheT-dt);if(Math.ceil(troT)+Math.ceil(cheT)*10!==b1)drawItems();}
  const g=slippery(c.y+.3),boom=phao.s==='boom';
  c.v-=6*dt;c.v-=c.v*2.4*dt;
  if(boom)c.v-=5*dt;
  c.v=Math.max(c.v,-(g?3:1.5)*(boom?1.6:1));
  if(wind.s==='gust'&&c.slip<=0&&c.v<0)c.v=0;
  if(!boom&&atKnot(c.y)&&c.v<0&&c.slip<=0&&c.stun<=0)c.v=0;
  c.y+=c.v*dt;if(c.y<0){c.y=0;if(c.v<0)c.v=0;}
  c.stun-=dt;c.slip-=dt;
  if(c.y>=poleH-1.05){c.y=poleH-1.05;win();return;}

  // Lý Thông
  if(ch.delay>0)ch.delay-=dt;else{let sp=PR.ch;if(c.y-ch.y>TUNE.catchGap)sp*=TUNE.catchX;ch.y=Math.min(ch.y+sp*dt,poleH-2);}
  taunt-=dt;if(ch.y>0&&c.y-ch.y<2.1&&taunt<=0){taunt=6;say(tr('taunt'),ch.y+1.3,'#cfe0ff');speak(tr('taunt'),'ly');}
  if(ch.y+1.05>=c.y){lose(tr('caught'));if(mode!=='play')return;}
  if(ch2){if(ch2.delay>0)ch2.delay-=dt;else{let sp=PR.ch*.85;if(c.y-ch2.y>TUNE.catchGap+.5)sp*=TUNE.catchX;ch2.y=Math.min(ch2.y+sp*dt,poleH-2.4);}
    if(ch2.y<ch.y&&ch2.y>ch.y-1.15)ch2.y=ch.y-1.15;
    if(ch2.y+1.05>=c.y){lose(tr('caughtMe'));if(mode!=='play')return;}}

  // Trạng Quỳnh nói một câu đầu cấp
  if(!quynhSaid&&time>3.2){quynhSaid=1;if(Math.random()<.65)quynh();}

  // gió
  if(time>=nextW&&wind.s==='none'){if(busy())nextW=time+2;else{wind={s:'warn',t:.9,dir:Math.random()<.5?-1:1};beep(180,.5,'sine',.04,80);}}
  if(wind.s!=='none'){wind.t-=dt;if(wind.t<=0){if(wind.s==='warn'){wind.s='gust';wind.t=R(1,1.5+.04*PR.e);}else{wind.s='none';nextW=time+R(3.5,7)/PR.wRate;}}}

  // pháo (chặng 2+)
  if(time>=nextP&&phao.s==='none'){if(busy())nextP=time+2;else{phao={s:'warn',t:1.1,h:Math.min(poleH-.5,c.y+1.6)};beep(1200,.6,'sine',.02,-300);}}
  if(phao.s!=='none'){phao.t-=dt;if(phao.t<=0){
    if(phao.s==='warn'){phao.s='boom';speak(tr('cole'),'crowd');phao.t=1.3;shake=.6;boomSnd();

    else{phao.s='none';nextP=time+R(5,9)/(1+.03*PR.e);}}}
  if(boom)shake=Math.max(shake,.25);

  // sóng lắc cột (chặng 4)
  if(time>=nextS&&song.s==='none'){if(busy())nextS=time+2;else{song={s:'warn',t:1.1};beep(260,.5,'sine',.04,-60);speak(tr('song1'),'crowd');}}
  if(song.s!=='none'){song.t-=dt;if(song.t<=0){if(song.s==='warn'){song.s='on';song.t=R(3,4.2);}else{song.s='none';nextS=time+R(5,8)/(1+.02*PR.e);}}}
  // trâu húc (chặng 5)
  if(time>=nextT&&trau.s==='none'){if(busy())nextT=time+2;else{trau={s:'warn',t:2.3,side:Math.random()<.5?-1:1};beep(140,.6,'sawtooth',.05,-40);speak(tr('trau1'),'crowd');}}
  if(trau.s!=='none'){trau.t-=dt;if(trau.t<=0){
    if(trau.s==='warn'){trau.s='hit';trau.t=.8;shake=.7;beep(80,.5,'sawtooth',.08,-30);
      if(atKnot(c.y)&&c.stun<=0)say(tr('trauSafe'),c.y+1.2,'#d8ffd0');else{c.y=Math.max(0,c.y-1.2);c.v=-1;c.stun=.4;say(tr('trauHit'),c.y+1.2,'#fff1a8');}
      ch.y-=1.2;if(ch2)ch2.y-=1.2;}
    else{trau.s='none';nextT=time+R(6,9)/(1+.02*PR.e);}}}
  // mưa: chớp
  if(PR.rain&&time>=nextFlash){flash=.35;nextFlash=time+R(5,10);setTimeout(()=>beep(60,.9,'sawtooth',.06,-20),400);}
  if(flash>0)flash-=dt;
  fogs.forEach(f=>{f.y+=Math.sin(time*.4+f.ph)*dt*.25;});

  if(time>=nextB){
    const n=PR.dbl&&Math.random()<.35?2:1;
    for(let i=0;i<n;i++){let tgv=c.y+.45+R(-.35,1.3)+(i?R(1,1.8):0);tgv=Math.max(.6,Math.min(poleH-1.3,tgv));

    beep(660,.08,'square',.03);nextB=time+R(1.8,4)/PR.bRate;
  }
  bananas.forEach(b=>{if(b.w>0){b.w-=dt;}else{b.f+=dt/.35;b.rot+=dt*14;if(b.f>=.5&&!b.hit){b.hit=1;if(Math.abs(c.y+.45-b.tg)<.5)hitPlayer('banana');}}});
  bananas=bananas.filter(b=>b.f<1.2);

  // chim (chặng 3)
  if(time>=nextBird){
    const side=Math.random()<.5?-1:1,y0=Math.min(poleH-1.2,c.y+.9+R(0,1.6));
    const n=1+(Math.random()<.45?1:0)+(L>=26&&Math.random()<.4?1:0);
    for(let i=0;i<n;i++)birds.push({y0:y0+i*.45,y:y0+i*.45,side,w:.9+i*.15,x:side<0?-30:W+30,sp:R(150,200),ph:R(0,6),hit:0});

  }
  birds.forEach(b=>{if(b.w>0){b.w-=dt;return;}b.x+=-b.side*b.sp*dt;b.y=b.y0+Math.sin(time*3+b.ph)*.35;
    if(!b.hit&&Math.abs(b.x-W/2)<PPM*.28&&Math.abs(b.y-(c.y+.6))<.5){b.hit=1;hitPlayer('bird');}});
  birds=birds.filter(b=>b.w>0||(b.side<0?b.x<W+60:b.x>-60));

  texts.forEach(t=>{t.a-=dt;t.y+=dt*.6;});texts=texts.filter(t=>t.a>0);
  cam+=(c.y-.7-cam)*Math.min(1,dt*5);
  shake=Math.max(0,shake-dt);
  $('hH').textContent=c.y.toFixed(1).replace('.',S.lang==='en'?'.':',');
}

  else{buffalo(W/2+trau.side*-1*-50,gy-14,.9,trau.side<0?1:-1);ctx.font='800 30px "Baloo 2",sans-serif';ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#26150c';ctx.strokeText(tr('rầm'),W/2,gy-50);ctx.fillStyle='#f5c542';ctx.fillText(tr('rầm'),W/2,gy-50);}
}
function drawProgress(){
  const x=W-22,t=HH*.2,b=HH*.78;ctx.strokeStyle='rgba(38,21,12,.5)';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,t);ctx.lineTo(x,b);ctx.stroke();
  const p=y=>b-(Math.max(0,y)/poleH)*(b-t);
  grease.forEach(g=>{ctx.strokeStyle='#2a1d14';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(x,p(g[0]));ctx.lineTo(x,p(g[1]));ctx.stroke();});
  ctx.fillStyle='#f5c542';ctx.beginPath();ctx.arc(x,t,5,0,7);ctx.fill();
  ctx.fillStyle='#2f6fd0';ctx.beginPath();ctx.arc(x,p(ch.y+.5),6,0,7);ctx.fill();
  if(ch2){ctx.fillStyle='#8a5a2a';ctx.beginPath();ctx.arc(x,p(ch2.y+.5),6,0,7);ctx.fill();}
  ctx.fillStyle='#d7261e';ctx.beginPath();ctx.arc(x,p(c.y),7,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
}
function render(){
  const k=changOf(L)-1;
  ctx.save();
  if(shake>0)ctx.translate(R(-1,1)*shake*16,R(-1,1)*shake*16);
  drawBg(k);drawTao();drawBunting(k);drawBanner(k);drawPond(k);
  const sx=song.s==='on'?Math.sin(time*4.2)*PPM*.22:0;
  ctx.save();ctx.translate(sx,0);
  drawPole();drawLanterns();if(PR.fog)drawFog();
  if(troT>0){const pw=Math.max(16,PPM*.22);ctx.fillStyle='rgba(200,200,200,.35)';ctx.fillRect(W/2-pw/2-4,SY(c.y+1.4),pw+8,PPM*1.6);}
  const sway=wind.s==='gust'?Math.sin(time*18)*PPM*.06*wind.dir:(phao.s==='boom'?Math.sin(time*40)*PPM*.04:0);
  if(ch2&&ch2.y>-1.6)person(ch2.y,'#5a3a22','me',0);
  if(ch.y>-1.6)person(ch.y,'#1d3f7a',true,0);
  if(mode==='falling')person(fall.y,'#d7261e',false,0);else person(c.y,'#d7261e',false,sway);
  if(cheT>0){ctx.fillStyle='rgba(255,200,80,.5)';ctx.beginPath();ctx.arc(W/2,SY(c.y+.6),PPM*.55+Math.sin(time*12)*3,0,7);ctx.fill();}
  if(c.stun>0){ctx.fillStyle='#fff1a8';for(let i=0;i<3;i++){const a=time*8+i*2.1;ctx.beginPath();ctx.arc(W/2+Math.cos(a)*PPM*.18,SY(c.y+1.05)+Math.sin(a)*4,3,0,7);ctx.fill();}}
  ctx.restore();
  if(PR.dark)drawDark();if(PR.rain)drawRain();
  drawTrau();drawPhao();drawBananas();drawBirds();drawSong();
  texts.forEach(t=>{ctx.globalAlpha=Math.min(1,t.a);ctx.font='800 20px "Baloo 2",sans-serif';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#26150c';ctx.strokeText(t.t,W/2,SY(t.y));ctx.fillStyle=t.col;ctx.fillText(t.t,W/2,SY(t.y));ctx.globalAlpha=1;});
  bits.forEach(p=>{ctx.save();ctx.globalAlpha=Math.min(1,p.a);ctx.translate(p.x,p.y);if(p.w){ctx.fillStyle='#bfe6ff';ctx.beginPath();ctx.arc(0,0,3.5,0,7);ctx.fill();}else{ctx.rotate(p.r);ctx.fillStyle='#d7261e';ctx.fillRect(-4,-2,8,4);}ctx.restore();});
  drawWind();
  confetti.forEach(p=>{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-4,-2,8,4);ctx.restore();});
  ctx.restore();
  if(mode==='play'||mode==='falling')drawProgress();
  if(mode==='play'&&time<2.4&&c.y<.3){ctx.fillStyle='rgba(38,21,12,.75)';rr(W/2-120,HH*.82,240,40,12);ctx.fill();ctx.fillStyle='#fff';ctx.font='800 19px "Baloo 2",sans-serif';ctx.textAlign='center';ctx.fillText(tr('tap'),W/2,HH*.82+27);}
}

document.addEventListener('visibilitychange',()=>{if(document.hidden){musicStop();hush();}else if(mode==='play'&&S.music!==false)musicStart();});
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!window.__sim){update(dt);render();}requestAnimationFrame(loop);}
setup(Math.min(S.unl,MAXL));
if(!S.lang)show('langpick');else openMenu();
requestAnimationFrame(loop);
window.__lcm={get st(){return{mode,c,ch,ch2,wind,phao,song,trau,bananas,birds,knots,time,poleH,PR,L}},step:dt=>update(dt),draw:()=>render(),items:()=>drawItems(),setRun:o=>{run=o;},play:l=>{setup(l);run={};mode='play';},get S(){return S},get mode(){return mode},startLevel,go,setup,tap,get c(){return c},get ch(){return ch},win,lose:()=>lose(tr('caught')),set L(v){L=v}};
})();
</script>
